      var widget=null,siteKey=null,tsToken='';
      function loadTurnstile(){
        if(MOCK||!siteKey||widget!==null)return;widget=false;
        window.__tsReady=function(){widget=window.turnstile.render($('.ts-turnstile'),{sitekey:siteKey,action:'public_demo',language:lang==='pt'?'pt-br':lang,appearance:'interaction-only',
          callback:function(t){tsToken=t},'expired-callback':function(){tsToken=''},'error-callback':function(){tsToken=''}})};
        var s=document.createElement('script');s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=__tsReady';s.async=true;document.head.appendChild(s);
      }
      // The check runs invisibly; a fast visitor may submit before it finishes, so give it a few seconds.
      function whenToken(cb){var t0=Date.now();(function wait(){if(MOCK||tsToken)return cb(true);if(Date.now()-t0>6000)return cb(false);setTimeout(wait,250)})()}

      var pollTimer=null,pollStart=0;
      function render(d,token){
        if(d.status==='verify'){$$('.ts-wa')[0].href=d.whatsappUrl||$$('.ts-wa')[0].href;$('.ts-wa-msg').textContent=waText(d.whatsappUrl);show('verify');return true}
        if(d.status==='building'){
          $('.ts-dom').textContent=d.domain||'';$('.ts-ini-dom').textContent=ini(d.domain);
          if(sec.querySelector('[data-state=building]').hidden){show('building');buildSteps(true)}
          headline(C.buildingTitle,d.domain);
          return true;
        }
        if(d.status==='ready'){
          var co=d.companyName||d.domain;
          $('.ts-co').textContent=co;$('.ts-ini-co').textContent=ini(co);
          // Their own logo on the phone when the scrape found a usable one; the first letter otherwise.
          var av=$('.s-ready .ts-av'),lg=av.querySelector('img');av.classList.remove('logo');
          if(d.logo&&/^data:image\/(png|jpeg|webp|gif|x-icon);base64,/.test(d.logo)){lg.onload=function(){if(lg.naturalWidth>=48&&lg.naturalHeight>=48)av.classList.add('logo')};lg.src=d.logo}
          $$('.ts-wa')[1].href=d.whatsappUrl;
          var call=$('.ts-call');if(d.callNumber){call.hidden=false;call.href='tel:'+d.callNumber;call.textContent=fill(C.call,{number:fmtNum(d.callNumber)})}else call.hidden=true;
          var talk=function(){frame.src=d.voiceUrl;modal.hidden=false};
          $('.ts-talk').onclick=talk;$('.ts-answer').onclick=talk;
          show('ready');headline(C.readyTitle,co,C.readyEyebrow);return false;
        }
        save(null);
        blocked(d.status==='expired'?'expired':d.code||'network',d.bookingUrl);return false;
      }
      function poll(token){
        clearTimeout(pollTimer);
        var age=Date.now()-pollStart;if(age>15*60*1000)return;
        api('/requests/'+token).then(function(d){
          if(render(d,token))pollTimer=setTimeout(function(){poll(token)},age>120000?5000:2000);
        }).catch(function(){pollTimer=setTimeout(function(){poll(token)},5000)});
      }
      function start(token){save(token);pollStart=Date.now();mockT0=mockT0||Date.now();poll(token)}

      form.addEventListener('submit',function(e){
        e.preventDefault();err.textContent='';
        if(!input.value.trim()){err.textContent=C.err.invalid_url;input.focus();return}
        if(!form.consent.checked){err.textContent=C.err.consent;return}
        var btn=form.querySelector('button');btn.disabled=true;
        whenToken(function(ok){
          if(!ok){btn.disabled=false;err.textContent=C.err.bot_check;return}
          api('/requests',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({url:input.value.trim(),language:lang,consent:true,turnstileToken:tsToken})})
          .then(function(d){
            btn.disabled=false;
            if(!d.ok){
              if(window.turnstile&&widget){window.turnstile.reset(widget);tsToken=''}
              if(d.code==='invalid_url'||d.code==='consent'||d.code==='bot_check'||d.code==='invalid'){err.textContent=C.err[d.code==='invalid'?'invalid_url':d.code];return}
              blocked(d.code||'network',d.bookingUrl);return;
            }
            $('.ts-qr').innerHTML=d.qrSvg||'';$$('.ts-wa')[0].href=d.whatsappUrl;$('.ts-wa-msg').textContent=waText(d.whatsappUrl);
            mockT0=Date.now();show('verify');start(d.token);
          }).catch(function(){btn.disabled=false;err.textContent=C.err.network});
        });
      });
      $('.ts-again').addEventListener('click',function(){save(null);clearTimeout(pollTimer);input.value='';own='';cycle();show('form');loadTurnstile();if(window.turnstile&&widget)window.turnstile.reset(widget)});
      modal.querySelector('.ts-close').addEventListener('click',function(){modal.hidden=true;frame.src='about:blank'});

      api('/availability').then(function(a){
        siteKey=a.siteKey||null;
        var resume=load();
        if(resume&&/^[a-f0-9]{16}$/.test(resume)){start(resume);return}
        if(!a.available){blocked(a.reason==='busy'?'busy':'disabled');return}
        show('form');loadTurnstile();
      }).catch(function(){show('form')});
    })();
