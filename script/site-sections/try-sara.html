      };
      var C=COPY[lang],API='/api/public-demo',KEY='la_try_sara';
      function bookUrl(){return (document.querySelector('#book a.btn')||{}).href||'https://cal.com/leadawaker/quick-chat'}
      function $(s){return sec.querySelector(s)}
      function $$(s){return [].slice.call(sec.querySelectorAll(s))}
      function fill(s,v){return s.replace(/\{(\w+)\}/g,function(_,k){return v&&v[k]!=null?v[k]:''})}
      $$('[data-t]').forEach(function(el){var v=C[el.getAttribute('data-t')];if(v==null)return;if(el.hasAttribute('data-html'))el.innerHTML=v;else el.textContent=v});
      var form=$('form'),input=form.url,err=$('.ts-error'),modal=sec.querySelector('.ts-modal'),frame=modal.querySelector('iframe'),dev=$('.dev');
      input.placeholder=C.placeholder;input.setAttribute('aria-label',C.label);modal.querySelector('.ts-close').setAttribute('aria-label',C.close);
      var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

      /* The phone. Idle, it cycles example businesses with Sara typing their greeting;
         as soon as the visitor types, it becomes their own domain. */
      var biz=$('.s-idle .ts-biz'),say=$('.s-idle .ts-say'),exI=0,typeT=null,cycleT=null,own='';
      function host(v){v=String(v||'').trim().toLowerCase().replace(/^[a-z]+:\/\//,'').replace(/^www\./,'');return v.split(/[\/?#\s]/)[0].slice(0,40)}
      function greet(name,instant){
        clearTimeout(typeT);var full=fill(C.greet,{biz:name}),cut=full.indexOf(name)+name.length,n=instant||reduced?full.length:0;
        (function step(){
          var shown=full.slice(0,n),b=shown.slice(0,Math.min(n,cut)),rest=shown.slice(b.length);
          say.innerHTML='';var bb=document.createElement('b');bb.textContent=b;say.appendChild(bb);say.appendChild(document.createTextNode(rest));
          if(n<full.length){var cur=document.createElement('i');cur.className='ts-cur';say.appendChild(cur);n++;typeT=setTimeout(step,28)}
        })();
      }
      function setBiz(name,instant){
        if(biz.textContent===name)return;
        if(instant){biz.textContent=name;greet(name,true);return}
        biz.classList.add('swap');setTimeout(function(){biz.textContent=name;biz.classList.remove('swap');greet(name)},220);
      }
      function cycle(){clearTimeout(cycleT);if(own)return;setBiz(C.examples[exI%C.examples.length]);exI++;cycleT=setTimeout(cycle,5200)}
      input.addEventListener('input',function(){
        own=host(input.value);clearTimeout(cycleT);
        if(own)setBiz(own,true);else cycleT=setTimeout(cycle,900);
      });
      cycle();

      function scene(s){dev.setAttribute('data-scene',s)}
      function track(n){$$('.ts-track li').forEach(function(li,i){li.className=i<n-1?'done':i===n-1?'on':''})}
      var buildT=null;
      function buildSteps(on){
        clearTimeout(buildT);var items=$$('.ts-steps li'),i=0;
        items.forEach(function(li){li.className=''});
        if(!on)return;
        (function next(){
          items.forEach(function(li,k){li.className=k<i?'ok':k===i?'now':''});
          if(i<items.length-1){i++;buildT=setTimeout(next,9000)}
        })();
      }
      function show(state){
        $$('.ts-state').forEach(function(el){el.hidden=el.getAttribute('data-state')!==state});
        track(state==='verify'?2:state==='building'?2:state==='ready'?3:1);
        if(state==='building')$$('.ts-track li')[1].className='done';
        scene(state==='verify'||state==='building'||state==='ready'?state:'idle');
        if(state!=='building')buildSteps(false);
      }
      function blocked(code,bookingUrl){$('.ts-reason').textContent=C.err[code]||C.err.network;$('.ts-book').href=bookingUrl||bookUrl();show('blocked')}
      function fmtNum(n){var d=String(n||'').replace(/\D/g,'');if(d.indexOf('31')===0)return '+31 '+d.slice(2,4)+' '+d.slice(4,7)+' '+d.slice(7);if(d.indexOf('44')===0)return '+44 '+d.slice(2,6)+' '+d.slice(6);return '+'+d}
      function waText(url){try{return new URL(url).searchParams.get('text')||C.waMsg}catch(e){return C.waMsg}}
      function save(t){try{t?sessionStorage.setItem(KEY,t):sessionStorage.removeItem(KEY)}catch(e){}}
      function load(){try{return sessionStorage.getItem(KEY)}catch(e){return null}}

      /* Fake answers for ?try=mock: walks through every state without a server. */
      var mockT0=0;
      function api(path,opts){
        if(!MOCK)return fetch(API+path,opts).then(function(r){return r.json().then(function(b){b._status=r.status;return b})});
        return new Promise(function(res){setTimeout(function(){
          if(path==='/availability')return res({available:true,siteKey:null});
          if(path==='/requests')return res({ok:true,token:'0123456789abcdef',domain:'brightsmile.nl',whatsappUrl:'https://wa.me/31627458300',
            qrSvg:'<svg viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg"><rect width="10" height="10" fill="#fff"/><path d="M1 1h3v3H1zM6 1h3v3H6zM1 6h3v3H1zM6 6h1v1H6zM8 8h1v1H8z" fill="#1F1A14"/></svg>'});
          var s=(Date.now()-mockT0)/1000;
          res(s<6?{status:'verify',domain:'brightsmile.nl'}:s<30?{status:'building',domain:'brightsmile.nl'}:
            {status:'ready',domain:'brightsmile.nl',companyName:'Brightsmile Dental',voiceUrl:'/voice-demo?embed=1',whatsappUrl:'https://wa.me/31627458300',callNumber:'+31738519847'});
        },300)});
      }

      var widget=null,siteKey=null,tsToken='';
      function loadTurnstile(){
        if(MOCK||!siteKey||widget!==null)return;widget=false;
        window.__tsReady=function(){widget=window.turnstile.render($('.ts-turnstile'),{sitekey:siteKey,action:'public_demo',language:lang==='pt'?'pt-br':lang,appearance:'interaction-only',
          callback:function(t){tsToken=t},'expired-callback':function(){tsToken=''},'error-callback':function(){tsToken=''}})};
        var s=document.createElement('script');s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=__tsReady';s.async=true;document.head.appendChild(s);
      }
      // The check runs invisibly; a fast visitor may submit before it finishes, so give it a few seconds.
      function whenToken(cb){var t0=Date.now();(function wait(){if(MOCK||tsToken)return cb(true);if(Date.now()-t0>6000)return cb(false);setTimeout(wait,250)})()}

      var pollTimer=null,pollStart=0;
      function render(d,token){
        if(d.status==='verify'){$$('.ts-wa')[0].href=d.whatsappUrl||$$('.ts-wa')[0].href;$('.ts-wa-msg').textContent=waText(d.whatsappUrl);show('verify');return true}
        if(d.status==='building'){
          $('[data-t=buildingTitle]').textContent=fill(C.buildingTitle,{domain:d.domain});$('.ts-dom').textContent=d.domain||'';
          if(sec.querySelector('[data-state=building]').hidden){show('building');buildSteps(true)}
          return true;
        }
        if(d.status==='ready'){
          var co=d.companyName||d.domain;
          $('[data-t=readyTitle]').textContent=fill(C.readyTitle,{company:co});$('.ts-co').textContent=co;
          $$('.ts-wa')[1].href=d.whatsappUrl;
          var call=$('.ts-call');if(d.callNumber){call.hidden=false;call.href='tel:'+d.callNumber;call.textContent=fill(C.call,{number:fmtNum(d.callNumber)})}else call.hidden=true;
          var talk=function(){frame.src=d.voiceUrl;modal.hidden=false};
          $('.ts-talk').onclick=talk;$('.ts-answer').onclick=talk;
          show('ready');return false;
        }
        save(null);
        blocked(d.status==='expired'?'expired':d.code||'network',d.bookingUrl);return false;
      }
      function poll(token){
        clearTimeout(pollTimer);
        var age=Date.now()-pollStart;if(age>15*60*1000)return;
        api('/requests/'+token).then(function(d){
          if(render(d,token))pollTimer=setTimeout(function(){poll(token)},age>120000?5000:2000);
        }).catch(function(){pollTimer=setTimeout(function(){poll(token)},5000)});
      }
      function start(token){save(token);pollStart=Date.now();mockT0=mockT0||Date.now();poll(token)}

      form.addEventListener('submit',function(e){
        e.preventDefault();err.textContent='';
        if(!input.value.trim()){err.textContent=C.err.invalid_url;input.focus();return}
        if(!form.consent.checked){err.textContent=C.err.consent;return}
        var btn=form.querySelector('button');btn.disabled=true;
        whenToken(function(ok){
          if(!ok){btn.disabled=false;err.textContent=C.err.bot_check;return}
          api('/requests',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({url:input.value.trim(),language:lang,consent:true,turnstileToken:tsToken})})
          .then(function(d){
            btn.disabled=false;
            if(!d.ok){
              if(window.turnstile&&widget){window.turnstile.reset(widget);tsToken=''}
              if(d.code==='invalid_url'||d.code==='consent'||d.code==='bot_check'||d.code==='invalid'){err.textContent=C.err[d.code==='invalid'?'invalid_url':d.code];return}
              blocked(d.code||'network',d.bookingUrl);return;
            }
            $('.ts-qr').innerHTML=d.qrSvg||'';$$('.ts-wa')[0].href=d.whatsappUrl;$('.ts-wa-msg').textContent=waText(d.whatsappUrl);
            mockT0=Date.now();show('verify');start(d.token);
          }).catch(function(){btn.disabled=false;err.textContent=C.err.network});
        });
      });
      $('.ts-again').addEventListener('click',function(){save(null);clearTimeout(pollTimer);input.value='';own='';cycle();show('form');loadTurnstile();if(window.turnstile&&widget)window.turnstile.reset(widget)});
      modal.querySelector('.ts-close').addEventListener('click',function(){modal.hidden=true;frame.src='about:blank'});

      api('/availability').then(function(a){
        siteKey=a.siteKey||null;
        var resume=load();
        if(resume&&/^[a-f0-9]{16}$/.test(resume)){start(resume);return}
        if(!a.available){blocked(a.reason==='busy'?'busy':'disabled');return}
        show('form');loadTurnstile();
      }).catch(function(){show('form')});
    })();
    </script>
