<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Call Emma — LeadAwaker Voice Demo</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f2;
    --card-bg: #ffffff;
    --text: #241b16;
    --text-muted: #6b6058;
    --accent: #7a2e2e;
    --accent-hover: #5f2222;
    --accent-soft: #f3e7e4;
    --border: #e5ddd4;
    --field-bg: #faf8f5;
    --error-bg: #fbe9e7;
    --error-text: #8a2c1f;
    --live-dot: #2e8b57;
    --bubble-them-bg: #f3e7e4;
    --bubble-them-text: #3a221d;
    --bubble-you-bg: #ece7e0;
    --bubble-you-text: #2b241f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1613;
      --card-bg: #26201c;
      --text: #f2ece5;
      --text-muted: #b3a89d;
      --accent: #c98a6b;
      --accent-hover: #dba489;
      --accent-soft: #3a2a24;
      --border: #3a322c;
      --field-bg: #1f1a17;
      --error-bg: #3a201c;
      --error-text: #f0a89a;
      --live-dot: #4fbd82;
      --bubble-them-bg: #3d2b25;
      --bubble-them-text: #f6e9e2;
      --bubble-you-bg: #2f2823;
      --bubble-you-text: #ebe3da;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    line-height: 1.5;
  }

  .card {
    width: 100%;
    max-width: 860px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 44px 48px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.10);
  }
  .card.is-live { padding: 0; overflow: hidden; }

  /* ---------- Setup state ---------- */
  .setup { text-align: center; }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    color: #fff;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  h1 {
    font-size: 30px;
    line-height: 1.2;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  .sub {
    color: var(--text-muted);
    font-size: 16px;
    margin: 0 auto 32px;
    max-width: 46ch;
  }

  .fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    text-align: left;
    margin-bottom: 26px;
  }
  @media (max-width: 620px) {
    .fields { grid-template-columns: 1fr; }
    .card { padding: 32px 24px; }
    h1 { font-size: 25px; }
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 7px;
  }
  input, select {
    font: inherit;
    font-size: 15px;
    width: 100%;
    padding: 12px 14px;
    color: var(--text);
    background: var(--field-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    appearance: none;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%),
                      linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) calc(50% + 2px), calc(100% - 15px) calc(50% + 2px);
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 40px;
  }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .field-hint {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 999px;
    padding: 15px 30px;
    font-size: 16px;
    font-weight: 600;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  button:disabled { cursor: not-allowed; opacity: 0.6; }
  #callBtn { background: var(--accent); color: #fff; width: 100%; }
  #callBtn:hover:not(:disabled) { background: var(--accent-hover); }

  .status { margin-top: 16px; font-size: 14px; color: var(--text-muted); min-height: 20px; }
  .error-box {
    margin-top: 18px;
    background: var(--error-bg);
    color: var(--error-text);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    text-align: left;
  }

  /* ---------- Call state ---------- */
  .callbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--accent-soft);
  }
  .callbar .mini-avatar {
    width: 42px; height: 42px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 600; font-size: 17px;
  }
  .callbar-meta { flex: 1 1 auto; min-width: 0; }
  .callbar-name {
    font-weight: 600; font-size: 16px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .callbar-state {
    font-size: 13px; color: var(--text-muted);
    display: flex; align-items: center; gap: 7px;
  }
  .pulse-dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--live-dot);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.8); }
  }
  #hangupBtn {
    background: transparent; color: var(--error-text);
    border: 1px solid var(--error-text);
    padding: 10px 20px; font-size: 14px; flex: none;
  }
  #hangupBtn:hover { background: var(--error-bg); }

  .transcript {
    height: 440px;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  @media (max-width: 620px) { .transcript { height: 60vh; } }

  .bubble {
    max-width: 74%;
    padding: 11px 15px;
    border-radius: 18px;
    font-size: 15.5px;
    position: relative;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    animation: rise 0.18s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: none; }
  }
  .bubble.them {
    align-self: flex-start;
    background: var(--bubble-them-bg);
    color: var(--bubble-them-text);
    border-bottom-left-radius: 5px;
  }
  .bubble.you {
    align-self: flex-end;
    background: var(--bubble-you-bg);
    color: var(--bubble-you-text);
    border-bottom-right-radius: 5px;
  }
  .bubble.pending { opacity: 0.72; }

  .transcript-empty {
    margin: auto;
    text-align: center;
    color: var(--text-muted);
    font-size: 14.5px;
    max-width: 34ch;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .transcript { scroll-behavior: auto; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="card" id="card">

  <!-- Setup -->
  <div class="setup" id="setup">
    <div class="avatar">E</div>
    <h1>Call Emma</h1>
    <p class="sub">An AI receptionist that answers the phone, handles the questions, and books the job. Pick a language, name the business, and talk to her.</p>

    <div class="fields">
      <div>
        <label for="langSelect">Language</label>
        <select id="langSelect">
          <option value="en" selected>English</option>
          <option value="nl">Nederlands</option>
          <option value="pt">Português (Brasil)</option>
        </select>
      </div>
      <div>
        <label for="companyInput">Business name</label>
        <input id="companyInput" type="text" placeholder="Brightside Solar" autocomplete="off" />
        <div class="field-hint">She answers as this company.</div>
      </div>
    </div>

    <button id="callBtn" type="button">Call Emma</button>
    <div id="status" class="status"></div>
    <div id="errorBox" class="error-box" hidden></div>
  </div>

  <!-- Live call -->
  <div id="callView" hidden>
    <div class="callbar">
      <div class="mini-avatar">E</div>
      <div class="callbar-meta">
        <div class="callbar-name" id="callbarName">Brightside Solar</div>
        <div class="callbar-state"><span class="pulse-dot"></span><span id="floorLabel">Connecting</span><span id="callTimer"></span></div>
      </div>
      <button id="hangupBtn" type="button">Hang up</button>
    </div>
    <div class="transcript" id="transcript">
      <div class="transcript-empty" id="transcriptEmpty">Emma picks up in a moment. Everything either of you says appears here.</div>
    </div>
  </div>

</div>

<audio id="remoteAudio" autoplay></audio>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // EDITABLE CONSTS — everything environment-specific lives here.
  // ---------------------------------------------------------------------

  // The LeadAwaker automation engine's /voice/token and /voice/relay routes
  // (automations repo: src/webhooks/realtime_voice_routes.py). This page is
  // served by Vercel and the engine runs on the Pi, so this must be an
  // absolute URL — same-origin does not work. The engine's CORSMiddleware
  // allows all origins.
  var ENGINE_BASE_URL = "https://webhooks.leadawaker.com";

  // Demo account/campaign this call is logged against in the CRM.
  var DEMO_ACCOUNT_ID = 52;
  var DEMO_CAMPAIGN_ID = 60;

  // OpenAI Realtime WebRTC: POST the local SDP offer as a raw body with the
  // ephemeral client_secret as bearer, get the SDP answer back as text.
  // The session (model, voice, prompt, VAD) is fixed server-side when the
  // token is minted, so nothing model-related belongs in this file.
  var OPENAI_REALTIME_CALLS_URL = "https://api.openai.com/v1/realtime/calls";

  var DEFAULT_COMPANY = "Brightside Solar";

  // ---------------------------------------------------------------------

  var card = document.getElementById("card");
  var setup = document.getElementById("setup");
  var callView = document.getElementById("callView");
  var callBtn = document.getElementById("callBtn");
  var hangupBtn = document.getElementById("hangupBtn");
  var langSelect = document.getElementById("langSelect");
  var companyInput = document.getElementById("companyInput");
  var callbarName = document.getElementById("callbarName");
  var floorLabel = document.getElementById("floorLabel");
  var callTimer = document.getElementById("callTimer");
  var statusEl = document.getElementById("status");
  var errorBox = document.getElementById("errorBox");
  var transcriptEl = document.getElementById("transcript");
  var transcriptEmpty = document.getElementById("transcriptEmpty");
  var remoteAudio = document.getElementById("remoteAudio");

  // Per-call state, reset on every attempt.
  var pc = null;
  var micStream = null;
  var dataChannel = null;
  var callId = null;
  var timerHandle = null;
  var startedAt = 0;
  // Bubbles still being spoken, so streaming deltas append to one bubble
  // instead of spawning a new one per fragment. Keyed per side.
  var pendingBubbles = { them: null, you: null };

  var COPY = {
    en: { connecting: "Connecting", listening: "Listening", speaking: "Emma is speaking" },
    nl: { connecting: "Verbinden", listening: "Luistert", speaking: "Emma praat" },
    pt: { connecting: "Conectando", listening: "Ouvindo", speaking: "Emma está falando" }
  };
  var copy = COPY.en;

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
    statusEl.textContent = "";
    callBtn.disabled = false;
    callBtn.textContent = "Call Emma";
  }

  function clearError() {
    errorBox.hidden = true;
    errorBox.textContent = "";
  }

  function setFloor(state) {
    floorLabel.textContent = copy[state] || copy.listening;
  }

  function startTimer() {
    startedAt = Date.now();
    timerHandle = setInterval(function () {
      var s = Math.floor((Date.now() - startedAt) / 1000);
      var mm = String(Math.floor(s / 60)).padStart(2, "0");
      var ss = String(s % 60).padStart(2, "0");
      callTimer.textContent = "· " + mm + ":" + ss;
    }, 1000);
  }

  function stopTimer() {
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
  }

  // --- Transcript bubbles -------------------------------------------------

  function bubbleFor(side) {
    if (pendingBubbles[side]) return pendingBubbles[side];
    if (transcriptEmpty) { transcriptEmpty.hidden = true; }
    var el = document.createElement("div");
    el.className = "bubble " + side + " pending";
    transcriptEl.appendChild(el);
    pendingBubbles[side] = el;
    return el;
  }

  function appendDelta(side, text) {
    if (!text) return;
    var el = bubbleFor(side);
    el.textContent += text;
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }

  function commitBubble(side, finalText) {
    var el = pendingBubbles[side];
    if (!el && !finalText) return;
    if (!el) el = bubbleFor(side);
    if (finalText) el.textContent = finalText;
    el.classList.remove("pending");
    pendingBubbles[side] = null;
    if (!el.textContent.trim()) { el.remove(); return; }
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }

  // Forward every realtime event to the engine so it lands in the CRM
  // (relay -> CallLogger -> create_interaction -> NOTIFY -> sse-listener).
  // Fire-and-forget: a dropped relay must never disturb a live call.
  function relayEvent(event) {
    fetch(ENGINE_BASE_URL + "/voice/relay", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        call_id: callId,
        account_id: DEMO_ACCOUNT_ID,
        campaign_id: DEMO_CAMPAIGN_ID,
        phone: "web",
        event: event
      })
    }).catch(function (err) {
      console.error("voice-demo: /voice/relay failed", err);
    });
  }

  function handleEvent(event) {
    if (!event || !event.type) return;
    switch (event.type) {
      // Emma, streaming then final.
      case "response.output_audio_transcript.delta":
        setFloor("speaking");
        appendDelta("them", event.delta);
        break;
      case "response.output_audio_transcript.done":
        commitBubble("them", event.transcript);
        break;

      // Caller, streaming then final. Deltas only arrive on transcription
      // models that stream; the .completed event is the reliable one.
      case "conversation.item.input_audio_transcription.delta":
        appendDelta("you", event.delta);
        break;
      case "conversation.item.input_audio_transcription.completed":
        commitBubble("you", event.transcript);
        break;

      case "input_audio_buffer.speech_started":
        setFloor("listening");
        break;
      case "response.done":
        setFloor("listening");
        break;
    }
  }

  // --- Call lifecycle -----------------------------------------------------

  async function fetchEphemeralToken(language, companyName) {
    var res = await fetch(ENGINE_BASE_URL + "/voice/token", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ language: language, company_name: companyName })
    });
    if (!res.ok) {
      throw new Error("Could not reach the voice engine (HTTP " + res.status + ").");
    }
    var data = await res.json();
    if (!data || !data.value) {
      throw new Error("The voice engine did not return a usable token.");
    }
    return data.value;
  }

  function enterCallView(companyName) {
    setup.hidden = true;
    callView.hidden = false;
    card.classList.add("is-live");
    callbarName.textContent = companyName;
    setFloor("connecting");
  }

  function leaveCallView() {
    setup.hidden = false;
    callView.hidden = true;
    card.classList.remove("is-live");
    callBtn.disabled = false;
    callBtn.textContent = "Call Emma";
    callTimer.textContent = "";
  }

  async function startCall() {
    clearError();
    var language = langSelect.value;
    var companyName = companyInput.value.trim() || DEFAULT_COMPANY;
    copy = COPY[language] || COPY.en;

    callId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random();
    callBtn.disabled = true;
    statusEl.textContent = "Connecting to Emma...";

    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      showError("Microphone access was blocked. Allow the mic in your browser, then call again.");
      return;
    }

    var ephemeralToken;
    try {
      ephemeralToken = await fetchEphemeralToken(language, companyName);
    } catch (err) {
      stopTracks();
      showError(err.message || "Could not start the call. Try again.");
      return;
    }

    try {
      pc = new RTCPeerConnection();

      pc.ontrack = function (event) {
        remoteAudio.srcObject = event.streams[0];
      };

      micStream.getAudioTracks().forEach(function (track) {
        pc.addTrack(track, micStream);
      });

      dataChannel = pc.createDataChannel("oai-events");

      dataChannel.onopen = function () {
        // Speak first, so Emma greets like someone picking up a phone
        // rather than waiting for the caller to open.
        dataChannel.send(JSON.stringify({ type: "response.create" }));
        statusEl.textContent = "";
        startTimer();
        setFloor("listening");
      };

      dataChannel.onmessage = function (e) {
        var event;
        try {
          event = JSON.parse(e.data);
        } catch (err) {
          console.error("voice-demo: unparseable data channel message", e.data);
          return;
        }
        relayEvent(event);
        handleEvent(event);
      };

      dataChannel.onclose = function () {
        if (pc) endCall();
      };

      enterCallView(companyName);

      var offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      var sdpResponse = await fetch(OPENAI_REALTIME_CALLS_URL, {
        method: "POST",
        body: offer.sdp,
        headers: {
          "Authorization": "Bearer " + ephemeralToken,
          "Content-Type": "application/sdp"
        }
      });

      if (!sdpResponse.ok) {
        throw new Error("OpenAI rejected the call setup (HTTP " + sdpResponse.status + ").");
      }

      var answerSdp = await sdpResponse.text();
      await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });
    } catch (err) {
      console.error("voice-demo: WebRTC setup failed", err);
      teardown();
      leaveCallView();
      showError(err.message || "Could not connect to Emma. Try again.");
    }
  }

  function stopTracks() {
    if (micStream) {
      micStream.getTracks().forEach(function (t) { t.stop(); });
      micStream = null;
    }
  }

  function teardown() {
    stopTimer();
    stopTracks();
    if (dataChannel) {
      try { dataChannel.close(); } catch (e) { /* no-op */ }
      dataChannel = null;
    }
    if (pc) {
      try { pc.close(); } catch (e) { /* no-op */ }
      pc = null;
    }
    remoteAudio.srcObject = null;
  }

  function endCall() {
    teardown();
    commitBubble("them");
    commitBubble("you");
    floorLabel.textContent = "Call ended";
    hangupBtn.textContent = "Start over";
    hangupBtn.onclick = resetToSetup;
  }

  function resetToSetup() {
    teardown();
    transcriptEl.innerHTML = "";
    transcriptEl.appendChild(transcriptEmpty);
    transcriptEmpty.hidden = false;
    pendingBubbles = { them: null, you: null };
    hangupBtn.textContent = "Hang up";
    hangupBtn.onclick = endCall;
    leaveCallView();
    statusEl.textContent = "";
  }

  callBtn.addEventListener("click", startCall);
  hangupBtn.onclick = endCall;
})();
</script>

</body>
</html>
