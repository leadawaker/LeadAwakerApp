<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Live demo — Lead Awaker</title>
  <link rel="icon" href="/premium/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <!-- Inlined into a <style> block at build time by script/build-premium.ts.
       Keep this tag exactly as written: the build matches it with a required
       regex and fails the build rather than shipping this page unstyled. -->
  <link rel="stylesheet" href="/premium/design-tokens.css" />
  <link rel="stylesheet" href="/premium/demo/demo.css" />
</head>
<body>
  <!--
    The page is built entirely by /premium/demo/main.js. What was one 1600-line
    file is now a stylesheet plus seven ES modules under /premium/demo/:

      main.js      the DOM, the session state, the network, the boot
      copy.js      the en/nl/pt strings and the language resolution
      tracker.js   the stage row in the header
      chat.js      the message thread
      recap.js     the right-hand rail (quote, summary, brief, calendar)
      format.js    escaping, linkifying, timestamps
      icons.js     inlined Lucide paths
      confetti.js  the booking celebration

    Plain modules loaded same-origin: no bundler, no build step of their own and
    no third-party script, which is the constraint this page has always kept.
    Everything but main.js renders strings from its arguments, so all of it is
    testable in node without a browser. `type="module"` defers by default, so
    #root exists by the time main.js runs.

    They live under a directory script/build-premium.ts has to keep; see
    KEEP_DIRS there and the assertion that checks they really shipped.
  -->
  <div id="root"></div>
  <script type="module" src="/premium/demo/main.js"></script>
</body>
</html>
