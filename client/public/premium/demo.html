<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Live demo — Lead Awaker</title>
  <link rel="icon" href="/premium/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/premium/design-tokens.css" />
  <style>
    /* This page runs on the landing page's bone palette, deliberately: a
       prospect opens it straight from leadawaker.com and it should read as the
       same product, not a separate dark app. The --d-* names below are this
       page's own slots, mapped onto the shared tokens loaded above, so the
       markup keeps one vocabulary while the colours stay the site's.
       (It used to override all of this with a near-black ground. Gabriel's
       call, 2026-08-12: the dark was unsettling next to the homepage.) */
    :root {
      --d-bg: var(--bg);                        /* bone ground */
      --d-bg-2: var(--paper);                   /* header + composer chrome */
      --d-surface: var(--surface);              /* AI bubble, cards */
      --d-surface-2: var(--bg-2);
      --d-line: var(--line);
      --d-line-2: rgba(110, 95, 65, 0.22);
      --d-ink: var(--ink);
      --d-mute: var(--mute);
      --d-mute-2: var(--mute-2);
      --d-accent: var(--wine);
      --d-accent-soft: var(--wine-soft);
      --d-ok: #4C7A5B;                          /* bone-friendly green, not the neon dark-mode one */
      --d-sans: var(--sans);
      --d-serif: var(--serif);
      --d-mono: var(--mono);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    /* Background and the warm directional light come from design-tokens.css
       (body, body::before, body::after) — not restated here, so this page can
       never drift from the homepage's ground. */
    body {
      color: var(--d-ink);
      font-family: var(--d-sans);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      /* A DEFINITE height, not min-height: with only a minimum, a long thread
         grows the flex column past the viewport and .stream expands instead of
         scrolling, which carries the composer off the bottom of the screen.
         dvh so mobile browser chrome doesn't crop it; vh is the fallback. */
      height: 100vh;
      height: 100dvh;
      /* The stream is the page's only scroll container (neumorphic shadows need
         one, see UI notes) — the document itself must never scroll. */
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* #root is the only flex child of body, and design-tokens.css styles it as
       a plain block. Without these it collapses to content height, which left
       the composer glued under the first message with the viewport empty below
       it: .wrap's `flex: 1 1 auto` had no flex container to grow inside. */
    #root {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ---------------- header ---------------- */
    /* Same colour as the CRM's own left nav bar (--chrome in
       client/src/styles/variables.css, light mode). Hardcoded rather than a
       shared variable: the CRM and this static landing/demo build are
       separate apps with separate CSS, nothing to reference across them. */
    .hdr {
      padding: 12px 22px;
      border-bottom: 1px solid rgba(90, 76, 50, 0.18);
      background: #E4DCCC;
      /* Also the containing block for .bump-btn: a sticky box is a positioned
         ancestor, so the corner button anchors here without joining (and so
         without off-centring) the flex cluster below. */
      position: sticky; top: 0; z-index: 20;
    }
    /* One centred cluster with an equal 50px gutter on either side of the
       tracker: logo — 50 — progress — 50 — client. Deliberately NOT a
       1fr/auto/1fr grid, which pins the tracker to the exact centre of the
       viewport but only by letting the two gutters differ; matching gutters is
       what actually reads as balanced here. */
    .hdr-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 50px;
    }
    /* Logo only. The wordmark is already inside logo-v2.svg, so the adjacent
       "Lead Awaker" text this used to carry printed the name twice. */
    .hdr-logo { display: inline-flex; align-items: center; flex: 0 0 auto; }
    .hdr-logo img { height: 28px; width: auto; display: block; }
    .hdr-div { width: 1px; height: 22px; background: rgba(90, 76, 50, 0.22); flex: 0 0 auto; }
    .pill {
      flex: 0 0 auto;
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 12.5px; font-weight: 600; letter-spacing: 0.01em;
      padding: 6px 14px; border-radius: 999px;
      /* --bg/--d-line are tuned for the cream composer; against the taupe
         header they read as almost no pill at all. Paper is lighter than the
         bar behind it, so the pill still stands off it the way it did on cream. */
      background: var(--paper); border: 1px solid rgba(90, 76, 50, 0.22);
      color: var(--d-ink);
      max-width: 42vw; overflow: hidden; white-space: nowrap;
    }
    .pill span { overflow: hidden; text-overflow: ellipsis; }
    .pill svg { color: var(--wine); flex: 0 0 auto; }

    /* Presenter control: fires a real follow-up into the thread on demand, so
       the bump can be shown live instead of waiting out the scheduler.
       Deliberately almost invisible: it is for whoever is DRIVING the demo,
       and a prospect noticing a button they were never told about would derail
       the thing it exists to sell. It is only rendered on an invited link
       (state.invited), which is the real gate; the low opacity just keeps it
       from catching the eye of someone sitting beside the presenter.
       Absolutely positioned so it cannot shift the centred header cluster. */
    .bump-btn {
      position: absolute; top: 50%; right: 14px; transform: translateY(-50%);
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 50%;
      background: transparent; border: none; cursor: pointer;
      color: var(--d-ink); opacity: 0.06;
      transition: opacity 180ms ease, background 180ms ease;
    }
    .bump-btn:hover, .bump-btn:focus-visible { opacity: 1; background: var(--paper); }
    .bump-btn:disabled { cursor: default; }
    /* Held visible for a beat after a successful send, so the presenter gets a
       confirmation without having to keep hovering. */
    .bump-btn.is-sent { opacity: 1; color: #2F7D4F; background: var(--paper); }

    /* ---------------- stage tracker ----------------
       The centrepiece. It narrates the pipeline moving while the conversation
       happens, so a prospect sees a lead being worked rather than a chatbot
       being clever. Every stage is driven by a signal the engine already emits. */
    .track { display: flex; align-items: center; gap: 0; flex: 0 1 auto; }
    /* Each stage carries its OWN colour in --c (set inline from STAGES), applied
       to the icon and the label together via currentColor — but only once the
       conversation has actually reached it. Stages still ahead stay grey, so
       colour marks real progress instead of decorating the whole row. */
    .track-step {
      display: flex; align-items: center; gap: 9px;
      /* Darker than the --d-mute-2 grey used elsewhere: that tone was picked
         against cream and all but vanishes on the taupe bar. */
      color: #5C5241;
      transition: color 400ms ease;
    }
    .track-step.on, .track-step.done { color: var(--c); }
    .track-ic {
      width: 21px; height: 21px; flex: 0 0 auto;
      transition: transform 400ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .track-step.on .track-ic { transform: scale(1.14); }
    .track-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.085em; text-transform: uppercase;
      color: currentColor; white-space: nowrap;
    }
    /* The connector between two stages doubles as the progress bar BETWEEN
       conversions, so the row keeps moving on the turns where the stage itself
       hasn't changed yet. Each connector fills in two halves: reaching the
       stage on its left fills it to the middle (the lead is on the way to the
       next conversion), and reaching the stage on its right fills the rest. */
    .track-line {
      width: 30px; height: 1px; background: rgba(90, 76, 50, 0.3); margin: 0 12px; flex: 0 0 auto;
      position: relative; overflow: hidden;
    }
    /* Each connector crosses BETWEEN two stage colours, so it carries the
       gradient from one to the next and the whole row reads as a single ramp
       rather than four flat segments with seams.
       The element is ALWAYS the full width of its track and is revealed by
       clip-path rather than grown by width. Animating width instead makes the
       gradient rescale on every frame, so the colour under a given pixel slides
       as it fills; pinning background-size to a fixed 30px fixes that only
       while the track is 30px, and the mobile rules below stretch it to
       `flex: 1 1 auto`, which left everything past the first 30px unpainted. */
    .track-line-fill {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, var(--c0), var(--c1));
      clip-path: inset(0 100% 0 0);
      /* Slower than the icon/label transitions: this one is meant to be SEEN
         growing, since it is the only part of the tracker that moves on a turn
         that doesn't cross a stage boundary. */
      transition: clip-path 620ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ---------------- layout ---------------- */
    .wrap { flex: 1 1 auto; display: flex; min-height: 0; }
    .chat-col { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .stream {
      flex: 1 1 auto; overflow-y: auto; min-height: 0;
      /* Generous horizontal padding: the bubbles carry neumorphic shadows and
         this is the page's scroll container, which would otherwise clip them. */
      padding: 30px 26px 14px;
      display: flex; flex-direction: column; gap: 14px;
      max-width: 760px; width: 100%; margin: 0 auto;
    }
    /* Keeps a short conversation sitting at the BOTTOM of the stream, next to
       the composer, rather than stranded at the top of a tall empty column —
       the way every chat client behaves.
       `margin-top: auto` on the first child rather than `justify-content:
       flex-end` on the container: the latter is unscrollable once the thread
       overflows, because overflow past a flex-end origin is unreachable. This
       resolves to 0 as soon as the content fills the column. */
    .stream > :first-child { margin-top: auto; }

    /* ---------------- bubbles ---------------- */
    .row { display: flex; gap: 10px; align-items: flex-end; }
    .row.me { flex-direction: row-reverse; }
    .av {
      width: 28px; height: 28px; border-radius: 50%; flex: 0 0 auto;
      background: var(--wine); color: var(--paper);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
      margin-bottom: 17px;
    }
    .bub-wrap { max-width: min(78%, 520px); display: flex; flex-direction: column; }
    .row.me .bub-wrap { align-items: flex-end; }
    .bub {
      padding: 10px 14px; border-radius: 16px;
      font-size: 14.5px; line-height: 1.5;
      white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
    }
    /* Only bubbles that are actually NEW since the last paint animate in.
       render() rebuilds the whole tree through innerHTML, so every bubble is a
       fresh element on every poll. With the animation on bare `.bub` the
       entire thread re-ran `rise` on each update, which read as a flicker
       between entries. messagesHtml() marks only the genuinely-new tail. */
    .bub.is-new { animation: rise 260ms cubic-bezier(0.22, 1, 0.36, 1); }
    /* Flat, not neumorphic: white on the bone ground carries the separation on
       its own, and the raised treatment fought the calm of the palette. The
       visitor's side goes flat with it so the two read as one system. */
    .row.ai .bub {
      background: #FFFFFF;
      border-bottom-left-radius: 5px;
    }
    .row.me .bub {
      background: var(--wine); color: var(--paper);
      border-bottom-right-radius: 5px;
    }
    /* Links inside a bubble. The AI hands out real booking URLs, which until now
       rendered as dead grey text a visitor could only copy by hand. Blue +
       underline because a link in a chat thread has to be recognisable as one
       instantly. This is the one place the page deliberately steps outside the
       earth palette. `break-all` so a long booking URL wraps inside the bubble
       instead of forcing it wider than its max-width. */
    .bub .lnk {
      color: #1D4ED8; text-decoration: underline; text-underline-offset: 2px;
      text-decoration-thickness: 1px; font-weight: 600; word-break: break-all;
      transition: color 160ms ease;
    }
    .bub .lnk:hover { color: #1E40AF; text-decoration-thickness: 2px; }
    /* On the visitor's wine bubble the same blue all but disappears, so it
       lightens to sit on the dark ground while still reading as "link". */
    .row.me .bub .lnk { color: #BFD4FF; }
    .row.me .bub .lnk:hover { color: #DDE7FF; }
    .ts { font-size: 10.5px; color: var(--d-mute-2); margin: 5px 4px 0; font-family: var(--d-mono); }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

    .typing { display: flex; gap: 4px; padding: 13px 15px; }
    .typing i {
      width: 6px; height: 6px; border-radius: 50%; background: var(--d-mute);
      animation: blink 1.3s infinite ease-in-out; display: block;
    }
    .typing i:nth-child(2) { animation-delay: 0.18s; }
    .typing i:nth-child(3) { animation-delay: 0.36s; }
    @keyframes blink { 0%, 70%, 100% { opacity: 0.25; } 35% { opacity: 1; } }

    /* ---------------- composer ---------------- */
    .composer-wrap {
      border-top: 1px solid var(--d-line);
      background: var(--paper);
      padding: 16px 26px 18px;
    }
    .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
    .input-shell {
      flex: 1 1 auto; display: flex; align-items: flex-end; gap: 8px;
      background: linear-gradient(145deg, var(--bg-2), var(--paper));
      box-shadow: var(--sh-inset-crisp);
      border-radius: 22px; padding: 7px 7px 7px 18px;
      transition: outline-color 180ms ease;
      outline: 2px solid transparent; outline-offset: 0;
    }
    .input-shell:focus-within { outline-color: var(--wine-glow); }
    .input-shell textarea {
      flex: 1 1 auto; background: none; border: none; outline: none; resize: none;
      color: var(--d-ink); font-family: inherit; font-size: 14.5px; line-height: 1.5;
      max-height: 120px; padding: 6px 0;
    }
    .input-shell textarea::placeholder { color: var(--d-mute-2); }
    .send {
      width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto;
      background: linear-gradient(145deg, #6E2638, #4B1A26);
      border: none; cursor: pointer; color: var(--paper);
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--sh-raised-crisp);
      transition: opacity 160ms ease, transform 160ms ease;
    }
    .send:hover:not(:disabled) { transform: scale(1.06); }
    .send:disabled { opacity: 0.35; cursor: default; }

    /* ---- restart: one button beside the composer, options in a popover ----
       Two full scenario labels sat inline here at first and squeezed the
       writing area; stacked underneath they pushed the composer up and made a
       secondary action the loudest thing on the page. A single button that
       opens the choices on demand keeps the editor the focus. */
    .restart-anchor { position: relative; flex: 0 0 auto; }
    .restart-btn {
      display: inline-flex; align-items: center; gap: 8px;
      height: 44px; padding: 0 16px; border-radius: 22px;
      background: var(--bg); border: 1px solid var(--d-line-2); color: var(--d-ink);
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease;
    }
    .restart-btn:hover:not(:disabled),
    .restart-btn[aria-expanded="true"] { background: var(--surface); border-color: var(--mute-2); }
    .restart-btn:disabled { opacity: 0.45; cursor: default; }
    .restart-btn svg { flex: 0 0 auto; }

    /* Once a demo is done the editor is gone (nothing left to type into) and
       the restart button is the only control left in the composer row — give
       it the full row instead of leaving it stranded on one side. */
    .composer.is-done { justify-content: center; }
    .composer.is-done .restart-anchor { width: 100%; max-width: 320px; }
    .composer.is-done .restart-btn { width: 100%; justify-content: center; height: 44px; }

    .restart-pop {
      position: absolute; bottom: calc(100% + 10px); right: 0;
      width: 290px; z-index: 40;
      background: var(--paper);
      border: 1px solid var(--d-line-2); border-radius: 14px;
      padding: 15px 15px 13px;
      box-shadow: 0 14px 38px -12px rgba(60, 45, 20, 0.32), 0 3px 10px -3px rgba(60, 45, 20, 0.14);
      animation: pop 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .restart-pop[hidden] { display: none; }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .pop-head {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--d-mute-2); font-family: var(--d-mono);
      margin-bottom: 10px; line-height: 1.45;
    }
    .pop-opts { display: flex; flex-direction: column; gap: 7px; }
    .ghost {
      width: 100%; text-align: left;
      padding: 10px 13px; border-radius: 9px;
      background: var(--bg); border: 1px solid var(--d-line); color: var(--d-ink);
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease;
    }
    .ghost:hover:not(:disabled) { background: var(--surface); border-color: var(--mute-2); }
    .ghost:disabled { opacity: 0.4; cursor: default; }
    .pop-rule { height: 1px; background: var(--d-line); margin: 13px 0 11px; }
    .pop-foot { font-size: 11.5px; line-height: 1.55; color: var(--d-mute-2); }
    .pop-foot a { color: var(--wine); text-decoration: underline; text-underline-offset: 2px; }
    .pop-foot a:hover { color: var(--wine-soft); }

    /* ---------------- recap panel ---------------- */
    .recap {
      flex: 0 0 360px; border-left: 1px solid var(--d-line);
      background: var(--glass-bg); overflow-y: auto; padding: 24px 24px 30px;
      -webkit-backdrop-filter: saturate(150%) blur(18px);
      backdrop-filter: saturate(150%) blur(18px);
      animation: slide 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes slide { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
    .recap h2, .recap-inline h2 { font-family: var(--d-serif); font-size: 23px; font-weight: 400; margin-bottom: 4px; }
    .recap .sub, .recap-inline .sub { font-size: 12.5px; color: var(--d-mute); margin-bottom: 22px; }
    .recap h3, .recap-inline h3 {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--d-mute-2); margin: 0 0 11px;
    }
    .recap-card {
      background: var(--paper); box-shadow: var(--sh-raised-crisp);
      border-radius: 12px; padding: 15px 16px; margin-bottom: 20px;
    }
    .recap-card p { font-size: 13.5px; line-height: 1.62; white-space: pre-wrap; }

    /* The labelled summary, one row per section. The engine writes it as
       "Interest: ...\nPain points: ..." with the LABELS deliberately left in
       English (the CRM's AiSummaryView keys off them), so the page translates
       them at render time the same way the CRM does, and colours each one.
       Colours are drawn from the site's own earth palette rather than a generic
       category ramp: the panel has to stay readable as one surface. */
    .sum-list { list-style: none; display: flex; flex-direction: column; gap: 11px; }
    .sum-row { position: relative; padding-left: 16px; font-size: 13.5px; line-height: 1.62; }
    .sum-row::before {
      content: ""; position: absolute; left: 0; top: 7px;
      width: 6px; height: 6px; border-radius: 50%; background: var(--sc);
    }
    .sum-k { color: var(--sc); font-weight: 700; }
    .sum-v { color: var(--d-ink); }
    /* A line the engine wrote that doesn't carry a known label still shows,
       rather than being silently dropped for not fitting the format. */
    .sum-row.is-plain { padding-left: 0; }
    .sum-row.is-plain::before { display: none; }

    /* ---------------- booked-date calendar ----------------
       Sits inside the Outcome row when the demo ended in a booking. A sentence
       saying "booked Tuesday at 15:00" is read; a month with one day lit up is
       SEEN, which is the difference the panel is trying to make at the exact
       moment the prospect is deciding whether this thing works. Drawn from
       plain numbers the server already resolved to the lead's zone, so there is
       no date maths here that a visitor in another timezone could shift. */
    .cal {
      margin-top: 12px; padding: 12px 13px 11px; border-radius: 11px;
      background: var(--bg); border: 1px solid var(--d-line);
    }
    .cal-head {
      font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--sc); text-align: center; margin-bottom: 9px;
    }
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
      /* Tabular figures: without them the 1s are narrow and the columns wobble. */
      font-variant-numeric: tabular-nums;
    }
    .cal-dow {
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--d-mute-2); text-align: center; padding-bottom: 3px;
    }
    .cal-d {
      font-size: 11.5px; line-height: 22px; height: 22px; text-align: center;
      color: var(--d-mute); border-radius: 6px;
    }
    /* Leading blanks before the 1st. Present rather than skipped so the grid
       columns stay aligned to the weekday header. */
    .cal-d.is-pad { visibility: hidden; }
    .cal-d.is-pick {
      background: var(--sc); color: var(--paper); font-weight: 700;
      box-shadow: 0 2px 7px -1px color-mix(in srgb, var(--sc) 55%, transparent);
    }
    .cal-time {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--d-line);
      font-size: 11.5px; color: var(--d-mute);
    }
    .cal-time b { color: var(--d-ink); font-weight: 700; font-size: 12.5px; }
    .cal-time svg { color: var(--sc); flex: 0 0 auto; }

    /* ---------------- the quote (decision mode) ----------------
       Decision-mode counterpart to the brief: the brief is what the ladder
       collected, this is the quote the whole conversation was about. Same
       bulleted rhythm so the two read as one family. */
    .quote-total {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      padding-bottom: 11px; margin-bottom: 4px; border-bottom: 1px solid var(--d-line);
    }
    .quote-total-k {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--d-mute-2);
    }
    .quote-total-v {
      font-family: var(--d-serif); font-size: 22px; font-weight: 400;
      color: var(--wine); line-height: 1.1;
    }
    .quote-row {
      position: relative; padding: 8px 0 8px 16px;
      font-size: 13px; line-height: 1.55; color: var(--d-ink);
    }
    .quote-row::before {
      content: ""; position: absolute; left: 0; top: 14px;
      width: 6px; height: 6px; border-radius: 50%; background: var(--sc);
    }

    .brief-row {
      display: flex; justify-content: space-between; gap: 14px; align-items: baseline;
      padding: 9px 0 9px 16px; border-bottom: 1px solid var(--d-line); position: relative;
    }
    .brief-row::before {
      content: ""; position: absolute; left: 0; top: 15px;
      width: 6px; height: 6px; border-radius: 50%; background: var(--sc);
    }

    .brief-v { font-size: 13px; font-weight: 600; text-align: right; }
    .recap .note, .recap-inline .note { font-size: 12px; color: var(--d-mute-2); line-height: 1.55; }

    /* ---------------- recap, inline-in-stream (mobile only) ----------------
       On mobile the aside becomes a tiny strip pinned below the composer —
       barely readable. Instead this renders the SAME recap content as a card
       sitting in the chat stream, right after the last message, so it reads
       as part of the conversation rather than a separate cramped panel.
       Hidden by default; the media query below swaps it in for `.recap`
       below the breakpoint where `.wrap` stacks to a column anyway. */
    .recap-inline { display: none; }

    .banner {
      max-width: 760px; margin: 0 auto 4px; padding: 11px 15px;
      background: var(--paper); box-shadow: var(--sh-raised-crisp);
      border-radius: 11px; font-size: 13px; color: var(--d-mute);
    }
    .center-msg {
      margin: auto; text-align: center; padding: 40px 24px; max-width: 420px;
    }
    .center-msg h1 { font-family: var(--d-serif); font-size: 30px; font-weight: 400; margin-bottom: 10px; }
    .center-msg p { color: var(--d-mute); font-size: 14px; }

    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    /* Booking celebration. Sits above everything and ignores pointer events, so
       it can never block the composer underneath it. */
    #confetti {
      position: fixed; inset: 0; pointer-events: none; z-index: 60;
      display: block;
    }

    @media (max-width: 1080px) {
      .hdr { padding: 11px 16px; }
      /* No room for a 50px gutter either side: logo and pill share a row and
         the tracker spans its own beneath them. */
      .hdr-inner {
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px 16px;
      }
      .hdr-logo img { height: 25px; }
      /* The tracker drops to its own full-width row below (order: 3), so a
         divider meant to sit between it and its neighbours has no sensible
         place to render here. */
      .hdr-div { display: none; }
      .track { order: 3; width: 100%; justify-content: space-between; }
      .track-line { width: auto; flex: 1 1 auto; margin: 0 6px; }
      .track-label { font-size: 9.5px; letter-spacing: 0.05em; }
      .track-ic { width: 18px; height: 18px; }
      .pill { max-width: 55vw; }
      .wrap { flex-direction: column; }
      /* The aside is desktop-only below this width — its content now renders
         inline in the stream instead (`.recap-inline`, appended in JS). */
      .recap { display: none; }
      .recap-inline {
        display: block;
        margin-top: 10px; padding-top: 16px;
        border-top: 1px solid var(--d-line);
      }
      .stream { padding: 20px 16px 10px; }
      .composer-wrap { padding: 13px 16px 15px; }
    }

       want the full row width (space-between, flexible lines) rather than
       clustering in the middle — a name next to a bare icon cluster reads as
       cramped. Only the CURRENT stage keeps its label; past/future stages
       stay icon-only so the row doesn't fight for space. */
    @media (max-width: 700px) {

      .track-line { flex: 1 1 auto; max-width: none; margin: 0 6px; }

    @media (max-width: 560px) {

    // `match` is the English label as written; order is the engine's order.

          "</div>"
        );
        if (i < last) {
          var target = lineFill(i, at);
          var from = prevFills[i] == null ? target : prevFills[i];
          // The connector spans two stages, so it carries both their colours and
          // the ramp reads as continuous. The one feeding the final stage ends
          // grey on a DNC, which is what makes the row visibly stop rather than
          // arrive.
          var next = (dnc && i + 1 === last) ? DNC_STAGE : STAGES[i + 1];
          out.push(
            '<div class="track-line">' +
              '<span class="track-line-fill" data-fill="' + target + '" ' +
                'style="clip-path:inset(0 ' + (100 - from) + '% 0 0);' +
                '--c0:' + step.color + ';--c1:' + next.color + '"></span>' +
            "</div>"
          );
          prevFills[i] = target;
        }
      }
      return '<div class="track">' + out.join("") + "</div>";
    }

    // Second half of the trick above: hand the freshly-inserted bars their real
    // widths one frame later, so the browser has a previous value to animate
    // FROM. Called by render() after the tree is in the document.
    function settleTracker() {
      var bars = root.querySelectorAll(".track-line-fill");
      if (!bars.length) return;
      requestAnimationFrame(function () {
        for (var i = 0; i < bars.length; i++) {
          var pct = Number(bars[i].getAttribute("data-fill"));
          bars[i].style.clipPath = "inset(0 " + (100 - pct) + "% 0 0)";
        }
      });
    }

    // How much of the thread was on screen at the end of the last render, so a
    // rebuild can tell a genuinely-new bubble from one that was already there.
    // Without this every bubble re-runs `rise` on every poll (see .bub.is-new).
    var paintedCount = 0;
    var paintedPending = false;

    function messagesHtml(s) {
      var out = [];
      // A restart hands back a shorter thread; treat that as a fresh one so the
      // new opener animates in rather than being mistaken for an old bubble.
      if (s.messages.length < paintedCount) paintedCount = 0;
      for (var i = 0; i < s.messages.length; i++) {
        var msg = s.messages[i];
        var mine = msg.role === "visitor";
        var prev = s.messages[i - 1];
        var showAv = !mine && (!prev || prev.role !== "ai");
        var fresh = i >= paintedCount ? " is-new" : "";
        out.push(
          '<div class="row ' + (mine ? "me" : "ai") + '">' +
            (mine ? "" : (showAv
              ? '<div class="av">' + esc(initials(s.agent)) + "</div>"
              : '<div class="av" style="visibility:hidden"></div>')) +
            '<div class="bub-wrap">' +
              '<div class="bub' + fresh + '">' + linkify(esc(msg.text)) + "</div>" +
              '<div class="ts">' + esc(clock(msg.at)) + "</div>" +
            "</div>" +
          "</div>"
        );
      }
      if (pending) {
        out.push(
          '<div class="row ai">' +
            '<div class="av">' + esc(initials(s.agent)) + "</div>" +
            '<div class="bub-wrap"><div class="bub typing' + (paintedPending ? "" : " is-new") +
              '"><i></i><i></i><i></i></div></div>' +
          "</div>"
        );
      }
      paintedCount = s.messages.length;
      paintedPending = pending;
      return out.join("");
    }

    // Shared markup for both the desktop aside and the mobile in-stream card
    // (`recapHtml` / `recapInlineHtml` below) — one source of truth so the two
    // surfaces can never drift apart.
    // Turn the engine's labelled summary into coloured, bulleted rows.
    //
    // The text arrives as "Interest: ...\nPain points: ..." with English labels
    // and the body in the lead's language. Each known label is swapped for its
    // translation and given its own colour; a line whose label isn't in the
    // table (or that carries no label at all) is still rendered, unstyled,
    // rather than dropped: a summary is not worth losing to a format change.
    // The booked day, drawn as a month with one date lit up, under the Outcome
    // line. A sentence saying a call is booked is read past; a calendar with a
    // day marked on it is the thing a prospect actually believes.
    //
    // Every Date below is constructed in UTC and formatted with timeZone:"UTC",
    // and that is load-bearing rather than incidental. The server has already
    // resolved the booking to a wall-clock year/month/day in the LEAD's zone, so
    // these are calendar coordinates, not instants. Reading them back through
    // the visitor's own zone would slide the grid a day for anyone whose local
    // midnight falls on the other side of the server's.
    //
    // Month and weekday names come from Intl in the panel's language, so a Dutch
    // demo reads "augustus 2026" without the page shipping three name tables.
    function calendarHtml(b) {
      if (!b || !b.year || !b.month || !b.day) return "";
      var lang = uiLang();
      var first = new Date(Date.UTC(b.year, b.month - 1, 1));

      var head;
      try {
        head = new Intl.DateTimeFormat(lang, { month: "long", year: "numeric", timeZone: "UTC" }).format(first);
      } catch (e) {
        head = b.month + "/" + b.year;
      }

      var cells = [];
      var dowFmt = null;
      try {
        dowFmt = new Intl.DateTimeFormat(lang, { weekday: "short", timeZone: "UTC" });
      } catch (e) { /* falls back to the ASCII initials below */ }
      for (var d = 0; d < 7; d++) {
        // 2024-01-01 was a Monday, so this walks Mon..Sun in order.
        var probe = new Date(Date.UTC(2024, 0, 1 + d));
        // Monday-first: the convention in every market this demo runs in
        // (NL, UK, BR). Some locales abbreviate with a trailing full stop
        // ("seg."), which is noise in a 7-column header.
        var name = dowFmt ? String(dowFmt.format(probe)).replace(/\.$/, "") : "MTWTFSS".charAt(d);
        cells.push('<span class="cal-dow">' + esc(name) + "</span>");
      }

      // getUTCDay() counts from Sunday; shift it so Monday is column 0.
      var pad = (first.getUTCDay() + 6) % 7;
      for (var p = 0; p < pad; p++) cells.push('<span class="cal-d is-pad"></span>');
      // Day 0 of the NEXT month is the last day of this one, which is also how
      // February gets its leap year right without a rule for it.
      var days = new Date(Date.UTC(b.year, b.month, 0)).getUTCDate();
      for (var n = 1; n <= days; n++) {
        cells.push('<span class="cal-d' + (n === b.day ? " is-pick" : "") + '">' + n + "</span>");
      }

      return (
        '<div class="cal">' +
          '<div class="cal-head">' + esc(head) + "</div>" +
          '<div class="cal-grid">' + cells.join("") + "</div>" +
          (b.time
            ? '<div class="cal-time">' + icon("clock", 13) +
                "<b>" + esc(b.time) + "</b>" +
                (b.timezone ? "<span>" + esc(String(b.timezone).replace(/_/g, " ")) + "</span>" : "") +
              "</div>"
            : "") +
        "</div>"
      );
    }

    function summaryHtml(text) {
      var lines = String(text || "").split(/\r?\n/);
      var rows = [];
      var sawOutcome = false;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        var colon = line.indexOf(":");
        var section = null;
        if (colon > 0) {
          var head = line.slice(0, colon).trim().toLowerCase();
          for (var j = 0; j < SUMMARY_SECTIONS.length; j++) {
            if (SUMMARY_SECTIONS[j].match === head) { section = SUMMARY_SECTIONS[j]; break; }
          }
        }
        if (!section) {
          rows.push('<li class="sum-row is-plain">' + linkify(esc(line)) + "</li>");
          continue;
        }
        var label = section[uiLang()] || section.en;
        // The calendar hangs off Outcome because that is the section it is the
        // evidence for, and it inherits the row's own --sc so the marked day is
        // the same green as the label above it. Absent on any demo that ended
        // without a booking, which is the whole point of showing it.
        var extra = "";
        if (section.match === "outcome") {
          sawOutcome = true;
          if (recap && recap.booking) extra = calendarHtml(recap.booking);
        }
        rows.push(
          '<li class="sum-row" style="--sc:' + section.color + '">' +
            '<span class="sum-k">' + esc(label) + ":</span> " +
            '<span class="sum-v">' + linkify(esc(line.slice(colon + 1).trim())) + "</span>" +
            extra +
          "</li>"
        );
      }
      // A real booking must never go unshown because the summary came back in a
      // shape with no Outcome line in it (a model wobble, or a fallback summary
      // that isn't labelled at all). The calendar is the strongest thing in the
      // panel; it gets its own row rather than being lost with the label.
      if (!sawOutcome && recap && recap.booking) {
        var solo = calendarHtml(recap.booking);
        if (solo) {
          var oc = SUMMARY_SECTIONS[SUMMARY_SECTIONS.length - 1];
          rows.push('<li class="sum-row is-plain" style="--sc:' + oc.color + '">' + solo + "</li>");
        }
      }
      return rows.length ? '<ul class="sum-list">' + rows.join("") + "</ul>" : "";
    }

    function recapContentHtml() {
      if (!recap) {
        return "<h2>" + esc(t("wrapping")) + '</h2><p class="sub">' + esc(t("wrappingSub")) + "</p>";
      }
      var briefRows = "";
      if (recap.brief && recap.brief.length) {
        for (var i = 0; i < recap.brief.length; i++) {
          // The brief's labels are generated per-language by the engine, so
          // there is no fixed set to key a colour off, so they cycle the same
          // palette the summary uses so the two panels read as one system.
          briefRows +=
            '<div class="brief-row" style="--sc:' + SECTION_COLORS[i % SECTION_COLORS.length] + '">' +
              '<span class="brief-k">' + esc(recap.brief[i].label) + "</span>" +
              '<span class="brief-v">' + esc(recap.brief[i].value) + "</span>" +
            "</div>";
        }
      }
      // The decision-mode counterpart to the brief. A scoping demo ends with a
      // spec the ladder collected; a decision demo ends with the quote the whole
      // conversation was about, which until now the panel never showed at all,
      // so a quoted prospect read a recap of a conversation whose subject was
      // missing from it. Same bulleted rhythm as the brief, with the total
      // pulled out as a headline because that is the number they remember.
      var quoteRows = "";
      var q = recap.quote;
      if (q && ((q.lines && q.lines.length) || q.total)) {
        if (q.total) {
          quoteRows +=
            '<div class="quote-total">' +
              '<span class="quote-total-k">' + esc(q.totalLabel || "") + "</span>" +
              '<span class="quote-total-v">' + esc(q.total) + "</span>" +
            "</div>";
        }
        for (var k = 0; k < (q.lines || []).length; k++) {
          quoteRows +=
            '<div class="quote-row" style="--sc:' + SECTION_COLORS[k % SECTION_COLORS.length] + '">' +
              esc(q.lines[k]) +
            "</div>";
        }
      }

      var summary = summaryHtml(recap.summary);
      return (
        "<h2>" + esc(t("recapTitle")) + "</h2>" +
        '<p class="sub">' + esc(t("recapSub")) + "</p>" +
        (summary
          ? "<h3>" + esc(t("conversation")) + '</h3><div class="recap-card">' + summary + "</div>"
          : "") +
        (quoteRows
          ? "<h3>" + esc(t("theQuote")) + '</h3><div class="recap-card">' + quoteRows + "</div>" +
            '<p class="note">' + esc(t("quoteNote")) + "</p>"
          : "") +
        (briefRows
          ? "<h3>" + esc(t("theBrief")) + '</h3><div class="recap-card">' + briefRows + "</div>" +
            '<p class="note">' + esc(t("briefNote")) + "</p>"
          // "No brief was collected" is the right thing to say about a SCOPING
          // demo that stopped early. It is simply false about a decision demo,
          // which never collects one by design and has just shown the quote
          // instead, so the quote panel suppresses it.
          : (quoteRows ? "" : '<p class="note">' + esc(t("briefEmpty")) + "</p>"))
      );
    }

    // Desktop: the right-rail aside, unchanged.
    function recapHtml() {
      return '<aside class="recap">' + recapContentHtml() + "</aside>";
    }

    // Mobile: the same content rendered as a card inside the stream, right
    // after the last message — CSS hides whichever of the two doesn't apply
    // at the current width (see the 1080px media query).
    function recapInlineHtml() {
      return '<div class="recap-inline">' + recapContentHtml() + "</div>";
    }

    function render() {
      if (fatal) {
        // `fatal` is a copy KEY, not a rendered string: these fire when there is
        // no state to read a demo language from, so they are resolved at paint
        // time against the browser's language instead (see browserLang).
        root.innerHTML =
          '<div class="center-msg"><h1>' + esc(t(fatal + "Title")) + "</h1><p>" +
          esc(t(fatal + "Body")) + "</p></div>";
        return;
      }
      if (!state) {
        root.innerHTML = '<div class="center-msg"><p>' + esc(t("loading")) + "</p></div>";
        return;
      }

      var s = state;
      // Server-provided: it carries the demo's real WhatsApp number, which only
      // the CRM knows. Absent it, the handoff line is hidden rather than
      // rendered as a wa.me link with no recipient.
      var waUrl = s.waLink || "";
      var restartsLeft = Math.max(0, (s.restartsMax || 0) - (s.restartsUsed || 0));
      // Only invited links (a prospect Gabriel sent this to) get to restart as
      // the OTHER scenario. Null on a public homepage session and on a link
      // that has spent its restarts; the server decides, not the page.
      var opts = restartsLeft > 0 && s.restartOptions && s.restartOptions.length
        ? s.restartOptions
        : null;

      root.innerHTML =
        '<header class="hdr">' +
          '<div class="hdr-inner">' +
            '<div class="hdr-logo"><img src="/premium/logo-v2.svg" alt="Lead Awaker" /></div>' +
            '<div class="hdr-div"></div>' +
            trackerHtml(s.stage, isDnc(s)) +
            (s.company
              ? '<div class="hdr-div"></div><div class="pill">' + icon("sparkles", 14) + "<span>" + esc(s.company) + "</span></div>"
              : "") +
          "</div>" +
          // Presenter-only, and only on an invited link: a public homepage
          // visitor never gets the markup at all, let alone the button.
          (s.invited
            ? '<button class="bump-btn" id="bump" title="' + esc(t("bumpTitle")) + '" ' +
                'aria-label="' + esc(t("bumpTitle")) + '"' + (busy || s.done ? " disabled" : "") + ">" +
                icon("send-horizontal", 15) +
              "</button>"
            : "") +
        "</header>" +
        '<div class="wrap">' +
          '<div class="chat-col">' +
            '<div class="stream" id="stream">' +
              (s.done && s.cappedReason === "turns"
                ? '<div class="banner">' + esc(t("capped")) + "</div>"
                : "") +
              messagesHtml(s) +
              (s.done ? recapInlineHtml() : "") +
            "</div>" +
            '<div class="composer-wrap">' +
              '<div class="composer' + (s.done ? " is-done" : "") + '">' +
                // The editor only exists while the conversation is live —
                // once it's done there's nothing left to type into, so it's
                // dropped entirely rather than left disabled and greyed out.
                (s.done ? "" :
                '<div class="input-shell">' +
                  '<label class="sr" for="msg">' + esc(t("replyLabel")) + "</label>" +
                  '<textarea id="msg" rows="1" placeholder="' + esc(t("replyPlaceholder")) + '"' +
                    (busy ? " disabled" : "") + "></textarea>" +
                  '<button class="send" id="send" title="Send"' + (busy ? " disabled" : "") + ">" +
                    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>' +
                  "</button>" +
                "</div>") +
                // Restart sits BESIDE the editor as one button; the choices,
                // the WhatsApp handoff and the remaining-restarts count all
                // live in the popover it opens, so none of that competes with
                // the composer until it is asked for.
                //
                // Invited links get the two scenarios; a public homepage
                // session gets the plain Restart it always had. Labels and
                // heading come from the server, already in the lead's language
                // (src/automations/demo_restart.py).
                '<div class="restart-anchor">' +
                  '<button class="restart-btn" id="restart-toggle" aria-haspopup="dialog" aria-expanded="' +
                    (popOpen ? "true" : "false") + '" aria-controls="restart-pop"' + (busy ? " disabled" : "") + ">" +
                    icon("rotate-ccw", 15) + "<span>" + esc(t("restart")) + "</span>" +
                  "</button>" +
                  '<div class="restart-pop" id="restart-pop" role="dialog" aria-label="' + esc(t("restartAria")) + '"' +
                    (popOpen ? "" : " hidden") + ">" +
                    (opts ? '<p class="pop-head">' + esc(opts[0].heading) + "</p>" : "") +
                    '<div class="pop-opts">' +
                      (opts
                        ? opts.map(function (o) {
                            return '<button class="ghost restart-opt" data-scenario="' + esc(o.value) + '"' +
                              (busy || restartsLeft <= 0 ? " disabled" : "") + ">" + esc(o.label) + "</button>";
                          }).join("")
                        : '<button class="ghost" id="restart"' + (busy || restartsLeft <= 0 ? " disabled" : "") + ">" +
                          esc(t("restart")) + "</button>") +
                    "</div>" +
                    '<div class="pop-rule"></div>' +
                    '<p class="pop-foot" id="pop-foot">' +
                      (waUrl
                        ? esc(t("onPhone")) + ' <a href="' + esc(waUrl) + '" target="_blank" rel="noopener">' +
                          esc(t("runInWa")) + "</a>."
                        : "") +
                      " " +
                      (restartsLeft > 0
                        ? esc(restartsLeft === 1
                            ? t("restartsLeftOne")
                            : t("restartsLeftMany").replace("{n}", restartsLeft))
                        : esc(t("noRestarts"))) +
                    "</p>" +
                  "</div>" +
                "</div>" +
              "</div>" +
            "</div>" +
          "</div>" +
          (s.done ? recapHtml() : "") +
        "</div>";

      wire();
      // After the tree is in the document, so the connectors have a previous
      // width to animate away from.
      settleTracker();
    }

    // ---- interaction ------------------------------------------------------
    // Toggles the popover in place instead of re-rendering: a render would
    // rebuild the textarea and throw focus back into it, yanking the visitor
    // out of the menu they just opened.
    function setPop(open) {
      popOpen = open;
      var pop = document.getElementById("restart-pop");
      var btn = document.getElementById("restart-toggle");
      if (pop) { if (open) pop.removeAttribute("hidden"); else pop.setAttribute("hidden", ""); }
      if (btn) btn.setAttribute("aria-expanded", open ? "true" : "false");
    }

    // Bound once, at module scope: wire() runs on every render and would stack
    // a fresh copy of these on the document each time.
    document.addEventListener("click", function (e) {
      if (!popOpen) return;
      if (e.target && e.target.closest && e.target.closest(".restart-anchor")) return;
      setPop(false);
    });
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Escape" || !popOpen) return;
      setPop(false);
      var btn = document.getElementById("restart-toggle");
      if (btn) btn.focus();
    });

    function wire() {
      var ta = document.getElementById("msg");
      var send = document.getElementById("send");
      var restart = document.getElementById("restart");
      var toggle = document.getElementById("restart-toggle");
      var stream = document.getElementById("stream");

      if (stream) stream.scrollTop = stream.scrollHeight;

      if (toggle) toggle.addEventListener("click", function () { setPop(!popOpen); });

      var bump = document.getElementById("bump");
      if (bump) bump.addEventListener("click", doBump);

      if (ta) {
        ta.value = draft;
        ta.style.height = "auto";
        ta.style.height = Math.min(120, ta.scrollHeight) + "px";
        // Never steal focus while the popover is open.
        if (!state.done && !busy && !popOpen) ta.focus();
        ta.addEventListener("input", function () {
          draft = ta.value;
          ta.style.height = "auto";
          ta.style.height = Math.min(120, ta.scrollHeight) + "px";
        });
        ta.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doSend(); }
        });
      }
      if (send) send.addEventListener("click", doSend);
      if (restart) restart.addEventListener("click", function () { doRestart(null); });
      Array.prototype.forEach.call(document.querySelectorAll(".restart-opt"), function (b) {
        b.addEventListener("click", function () { doRestart(b.getAttribute("data-scenario")); });
      });
    }

    function doSend() {
      if (busy || pending || !state || state.done) return;
      var text = draft.trim();
      if (!text) return;

      // Invalidate any poll fetch already in flight: without this, a response
      // that predates the send can land after the optimistic push below and
      // overwrite state.messages with server data that doesn't include it yet,
      // making the visitor's own message flicker or vanish.
      epoch++;

      // Optimistic: the visitor's own bubble appears instantly, then the typing
      // indicator. Waiting for the round trip to echo their own words back is
      // the single thing that makes a web chat feel broken.
      state.messages.push({ role: "visitor", text: text, at: new Date().toISOString() });
      draft = "";
      pending = true;
      busy = true;
      render();

      api("/message", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text: text })
      }).then(function () {
        busy = false;
        lastSig = "";      // force the next poll to re-render
        schedulePoll(1200);
      }).catch(function (err) {
        busy = false;
        pending = false;
        handleError(err);
      });
    }

    // `scenario` is null for the plain replay (public sessions) and one of the
    // server-supplied values for the two-option restart on an invited link.
    function doRestart(scenario) {
      if (busy || !state) return;
      busy = true;
      pending = false;
      var prevRecap = recap;   // snapshot so a failed restart can put the recap
                                // panel back to what it showed a moment ago,
                                // instead of leaving it stuck on the "wrapping
                                // up" placeholder until the next idle poll.
      recap = null;
      draft = "";
      // Invalidate any poll fetch already in flight: a routine poll started
      // before the restart can otherwise resolve AFTER it and silently revert
      // the UI to the old scenario's messages.
      epoch++;
      render();
      api("/restart", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(scenario ? { scenario: scenario } : {})
      }).then(function (next) {
        busy = false;
        state = next;
        lastSig = signature(next);
        popOpen = false;          // the choice was made; the menu has no reason to stay up
        render();
        // A restart is a fresh conversation, so it re-arms the celebration:
        // booking again in the new run should be celebrated again.
        celebrated = false;
        seenStage = next.stage || null;
        schedulePoll(4000);
      }).catch(function (err) {
        busy = false;
        recap = prevRecap;   // restore what was on screen before the optimistic clear
        handleError(err);
      });
    }

    // Presenter control: ask the engine for a real follow-up now. The reply is
    // the full state, so the bump lands in the thread without waiting for the
    // next poll. Failures stay quiet on purpose: this fires in front of a
    // prospect, and a red error where a follow-up was promised is worse than
    // nothing happening at all; the log still records it.
    function doBump() {
      if (busy || !state || state.done) return;
      busy = true;
      // Same reason doSend and doRestart bump the epoch: a poll already in
      // flight predates the follow-up and would overwrite state with a thread
      // that doesn't contain it yet, erasing the bubble the presenter just
      // demonstrated until the next poll put it back.
      epoch++;
      render();
      api("/bump", { method: "POST" }).then(function (next) {
        busy = false;
        state = next;
        lastSig = signature(next);
        render();
        var btn = document.getElementById("bump");
        if (btn) {
          btn.classList.add("is-sent");
          setTimeout(function () { btn.classList.remove("is-sent"); }, 1400);
        }
        schedulePoll(4000);
      }).catch(function (err) {
        busy = false;
        render();
        if (window.console && console.warn) console.warn("bump failed", err && err.code);
      });
    }

    function handleError(err) {
      if (err && err.status === 404) {
        fatal = "errExpired";
      } else if (err && err.code === "restart_limit") {
        // Not fatal: the conversation on screen is still readable. Render first
        // so the recap panel (restored by doRestart's catch) reflects the old
        // conversation again rather than staying on the placeholder, then patch
        // the popover's foot text to explain why the restart didn't go through.
        // popOpen is left as it was, so the message lands in the menu the
        // visitor still has open.
        render();
        var el = document.getElementById("pop-foot");
        if (el) el.textContent = t("restartLimit");
        return;
      } else {
        fatal = "errGeneric";
      }
      render();
    }

    // ---- polling ----------------------------------------------------------
    // The engine debounces before it calls the model, so a reply can be several
    // seconds out. Polling keeps each request short and lets a multi-message
    // reply arrive balloon by balloon, the way it does on WhatsApp.
    function schedulePoll(delay) {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(poll, delay);
    }

    function poll() {
      if (busy) { schedulePoll(1500); return; }
      var pollEpoch = epoch;   // captured before the fetch fires
      api("").then(function (next) {
        if (pollEpoch !== epoch) {
          // A restart or send landed while this fetch was in flight and moved
          // state on already; applying this response now would clobber that
          // fresher state with stale data. The action that bumped the epoch
          // already scheduled its own follow-up poll, but reschedule anyway
          // (rather than trusting this response's own `done`/messages, which
          // may no longer be accurate) so the loop can't stall if that action
          // is still pending or failed outright.
          schedulePoll(pending ? 1600 : 6000);
          return;
        }
        var sig = signature(next);
        var grew = state && next.messages.length > state.messages.length;
        state = next;
        if (grew) pending = false;
        if (sig !== lastSig) { lastSig = sig; render(); }
        maybeCelebrate(next);

        if (next.done) {
          if (!recap) loadRecap();
          schedulePoll(15000);       // idle: keep the session warm, nothing more
        } else {
          schedulePoll(pending ? 1600 : 6000);
        }
      }).catch(function (err) {
        if (pollEpoch !== epoch) { schedulePoll(pending ? 1600 : 6000); return; }
        if (err && err.status === 404) return handleError(err);
        schedulePoll(6000);          // transient: keep trying quietly
      });
    }

    function loadRecap() {
      if (recap) return;
      api("/recap").then(function (data) {
        recap = data || { summary: "", brief: [] };
        render();
      }).catch(function () {
        recap = { summary: "", brief: [] };
        render();
      });
    }

    // ---- booking celebration ----------------------------------------------
    // Fires once, on the transition INTO the booked stage ("objective"), which
    // is the moment the demo pays off. Deliberately not on first paint: someone
    // reopening a demo they booked yesterday should not be thrown a party for
    // it, so the first state we see only records the stage.
    var seenStage = null;
    var celebrated = false;

    function maybeCelebrate(next) {
      var stage = next && next.stage;
      if (seenStage && seenStage !== "objective" && stage === "objective" && !celebrated) {
        celebrated = true;
        confetti();
      }
      if (stage) seenStage = stage;
    }

    function confetti() {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      var cv = document.createElement("canvas");
      cv.id = "confetti";
      cv.setAttribute("aria-hidden", "true");
      document.body.appendChild(cv);
      var ctx = cv.getContext("2d");
      if (!ctx) { cv.parentNode.removeChild(cv); return; }

      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W = 0, H = 0;
      function size() {
        W = window.innerWidth; H = window.innerHeight;
        cv.width = W * dpr; cv.height = H * dpr;
        cv.style.width = W + "px"; cv.style.height = H + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      size();
      window.addEventListener("resize", size);

      // The site's own palette, not party colours: wine, its soft tint, a warm
      // gold picked from the directional light, and paper.
      var COLORS = ["#5E2230", "#7A2E3E", "#C9A227", "#F4EFE3", "#D8C9A3"];
      var bits = [];
      for (var i = 0; i < 110; i++) {
        bits.push({
          x: W * (0.15 + Math.random() * 0.7),
          y: H + 20 + Math.random() * 40,
          vx: (Math.random() - 0.5) * 5.2,
          vy: -(11 + Math.random() * 9),      // launched upward, then gravity takes it
          w: 5 + Math.random() * 6,
          h: 8 + Math.random() * 8,
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 0.32,
          c: COLORS[(Math.random() * COLORS.length) | 0]
        });
      }

      var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
      var LIFE = 2900;
      var FADE = 700;

      function frame(now) {
        var age = now - t0;
        if (age >= LIFE) {
          window.removeEventListener("resize", size);
          if (cv.parentNode) cv.parentNode.removeChild(cv);
          return;
        }
        ctx.clearRect(0, 0, W, H);
        var fade = age > LIFE - FADE ? (LIFE - age) / FADE : 1;
        for (var j = 0; j < bits.length; j++) {
          var b = bits[j];
          b.vy += 0.34;          // gravity
          b.vx *= 0.995;         // air drag
          b.x += b.vx; b.y += b.vy; b.rot += b.vr;
          if (b.y > H + 60) continue;
          ctx.save();
          ctx.globalAlpha = fade;
          ctx.translate(b.x, b.y);
          ctx.rotate(b.rot);
          ctx.fillStyle = b.c;
          ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
          ctx.restore();
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    // ---- keyboard-safe header (mobile) -------------------------------------
    // iOS Safari's own "scroll the focused input into view" behaviour moves
    // the whole page (via the visual viewport, not any CSS overflow rule) when
    // the on-screen keyboard opens on the bottom-docked composer, dragging the
    // sticky header off the top of the screen with it. The composer is already
    // positioned correctly by the flex layout once the keyboard is up, so that
    // scroll is never needed here — this just undoes it as soon as it happens.
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", function () {
        if (window.scrollY || document.documentElement.scrollTop) {
          window.scrollTo(0, 0);
        }
      });
    }

    // ---- boot -------------------------------------------------------------
    if (!TOKEN) {
      fatal = "errNoLink";
      render();
    } else {
      render();
      api("").then(function (s) {
        state = s;
        lastSig = signature(s);
        render();
        maybeCelebrate(s);        // records the opening stage; cannot fire yet
        if (s.done) loadRecap();
        schedulePoll(s.done ? 15000 : 6000);
      }).catch(handleError);
    }
  })();
  </script>
</body>
</html>
