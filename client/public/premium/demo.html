<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Live demo — Lead Awaker</title>
  <link rel="icon" href="/premium/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/premium/design-tokens.css" />
  <style>
    /* This page runs on the landing page's bone palette, deliberately: a
       prospect opens it straight from leadawaker.com and it should read as the
       same product, not a separate dark app. The --d-* names below are this
       page's own slots, mapped onto the shared tokens loaded above, so the
       markup keeps one vocabulary while the colours stay the site's.
       (It used to override all of this with a near-black ground. Gabriel's
       call, 2026-08-12: the dark was unsettling next to the homepage.) */
    :root {
      --d-bg: var(--bg);                        /* bone ground */
      --d-bg-2: var(--paper);                   /* header + composer chrome */
      --d-surface: var(--surface);              /* AI bubble, cards */
      --d-surface-2: var(--bg-2);
      --d-line: var(--line);
      --d-line-2: rgba(110, 95, 65, 0.22);
      --d-ink: var(--ink);
      --d-mute: var(--mute);
      --d-mute-2: var(--mute-2);
      --d-accent: var(--wine);
      --d-accent-soft: var(--wine-soft);
      --d-ok: #4C7A5B;                          /* bone-friendly green, not the neon dark-mode one */
      --d-sans: var(--sans);
      --d-serif: var(--serif);
      --d-mono: var(--mono);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    /* Background and the warm directional light come from design-tokens.css
       (body, body::before, body::after) — not restated here, so this page can
       never drift from the homepage's ground. */
    body {
      color: var(--d-ink);
      font-family: var(--d-sans);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      /* A DEFINITE height, not min-height: with only a minimum, a long thread
         grows the flex column past the viewport and .stream expands instead of
         scrolling, which carries the composer off the bottom of the screen.
         dvh so mobile browser chrome doesn't crop it; vh is the fallback. */
      height: 100vh;
      height: 100dvh;
      /* The stream is the page's only scroll container (neumorphic shadows need
         one, see UI notes) — the document itself must never scroll. */
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* #root is the only flex child of body, and design-tokens.css styles it as
       a plain block. Without these it collapses to content height, which left
       the composer glued under the first message with the viewport empty below
       it: .wrap's `flex: 1 1 auto` had no flex container to grow inside. */
    #root {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ---------------- header ---------------- */
    .hdr {
      display: flex; align-items: center; gap: 16px;
      padding: 13px 22px;
      border-bottom: 1px solid var(--d-line);
      background: var(--glass-bg-strong);
      -webkit-backdrop-filter: saturate(160%) blur(22px);
      backdrop-filter: saturate(160%) blur(22px);
      position: sticky; top: 0; z-index: 20;
    }
    /* Logo only. The wordmark is already inside logo-v2.svg, so the adjacent
       "Lead Awaker" text this used to carry printed the name twice. */
    .hdr-logo { display: inline-flex; align-items: center; flex: 0 0 auto; }
    .hdr-logo img { height: 30px; width: auto; display: block; }
    .hdr-spacer { flex: 1 1 auto; }
    .pill {
      flex: 0 0 auto;
      font-size: 12px; font-weight: 600; letter-spacing: 0.01em;
      padding: 7px 14px; border-radius: 999px;
      background: var(--surface); box-shadow: var(--sh-raised-crisp);
      color: var(--d-ink);
      max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ---------------- stage tracker ----------------
       The centrepiece. It narrates the pipeline moving while the conversation
       happens, so a prospect sees a lead being worked rather than a chatbot
       being clever. Every stage is driven by a signal the engine already emits. */
    .track { display: flex; align-items: center; gap: 0; flex: 0 1 auto; }
    .track-step { display: flex; align-items: center; gap: 8px; }
    .track-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--d-mute-2); flex: 0 0 auto;
      transition: background 400ms ease, box-shadow 400ms ease;
    }
    .track-label {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--d-mute-2); white-space: nowrap;
      transition: color 400ms ease;
    }
    .track-line {
      width: 34px; height: 1px; background: var(--d-line-2); margin: 0 12px; flex: 0 0 auto;
      transition: background 400ms ease;
    }
    .track-step.on .track-dot { background: var(--d-accent); box-shadow: 0 0 0 4px var(--wine-tint); }
    .track-step.on .track-label { color: var(--d-ink); }
    .track-step.done .track-dot { background: var(--d-ok); box-shadow: none; }
    .track-step.done .track-label { color: var(--d-mute); }

    /* ---------------- layout ---------------- */
    .wrap { flex: 1 1 auto; display: flex; min-height: 0; }
    .chat-col { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .stream {
      flex: 1 1 auto; overflow-y: auto; min-height: 0;
      /* Generous horizontal padding: the bubbles carry neumorphic shadows and
         this is the page's scroll container, which would otherwise clip them. */
      padding: 30px 26px 14px;
      display: flex; flex-direction: column; gap: 14px;
      max-width: 760px; width: 100%; margin: 0 auto;
    }
    /* Keeps a short conversation sitting at the BOTTOM of the stream, next to
       the composer, rather than stranded at the top of a tall empty column —
       the way every chat client behaves.
       `margin-top: auto` on the first child rather than `justify-content:
       flex-end` on the container: the latter is unscrollable once the thread
       overflows, because overflow past a flex-end origin is unreachable. This
       resolves to 0 as soon as the content fills the column. */
    .stream > :first-child { margin-top: auto; }

    /* ---------------- bubbles ---------------- */
    .row { display: flex; gap: 10px; align-items: flex-end; }
    .row.me { flex-direction: row-reverse; }
    .av {
      width: 28px; height: 28px; border-radius: 50%; flex: 0 0 auto;
      background: linear-gradient(145deg, var(--wine-soft), var(--wine));
      color: var(--paper);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
      margin-bottom: 17px;
      box-shadow: var(--sh-raised-crisp);
    }
    .bub-wrap { max-width: min(78%, 520px); display: flex; flex-direction: column; }
    .row.me .bub-wrap { align-items: flex-end; }
    .bub {
      padding: 10px 14px; border-radius: 16px;
      font-size: 14.5px; line-height: 1.5;
      white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
      animation: rise 260ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .row.ai .bub {
      background: var(--paper);
      box-shadow: var(--sh-raised-crisp);
      border-bottom-left-radius: 5px;
    }
    .row.me .bub {
      background: linear-gradient(145deg, #6E2638, #4B1A26);
      color: var(--paper);
      box-shadow: var(--sh-raised-crisp);
      border-bottom-right-radius: 5px;
    }
    .ts { font-size: 10.5px; color: var(--d-mute-2); margin: 5px 4px 0; font-family: var(--d-mono); }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

    .typing { display: flex; gap: 4px; padding: 13px 15px; }
    .typing i {
      width: 6px; height: 6px; border-radius: 50%; background: var(--d-mute);
      animation: blink 1.3s infinite ease-in-out; display: block;
    }
    .typing i:nth-child(2) { animation-delay: 0.18s; }
    .typing i:nth-child(3) { animation-delay: 0.36s; }
    @keyframes blink { 0%, 70%, 100% { opacity: 0.25; } 35% { opacity: 1; } }

    /* ---------------- composer ---------------- */
    .composer-wrap {
      border-top: 1px solid var(--d-line);
      background: var(--glass-bg-strong);
      -webkit-backdrop-filter: saturate(160%) blur(22px);
      backdrop-filter: saturate(160%) blur(22px);
      padding: 16px 26px 18px;
    }
    .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
    .input-shell {
      flex: 1 1 auto; display: flex; align-items: flex-end; gap: 8px;
      background: linear-gradient(145deg, var(--bg-2), var(--paper));
      box-shadow: var(--sh-inset-crisp);
      border-radius: 22px; padding: 7px 7px 7px 18px;
      transition: outline-color 180ms ease;
      outline: 2px solid transparent; outline-offset: 0;
    }
    .input-shell:focus-within { outline-color: var(--wine-glow); }
    .input-shell textarea {
      flex: 1 1 auto; background: none; border: none; outline: none; resize: none;
      color: var(--d-ink); font-family: inherit; font-size: 14.5px; line-height: 1.5;
      max-height: 120px; padding: 6px 0;
    }
    .input-shell textarea::placeholder { color: var(--d-mute-2); }
    .send {
      width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto;
      background: linear-gradient(145deg, #6E2638, #4B1A26);
      border: none; cursor: pointer; color: var(--paper);
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--sh-raised-crisp);
      transition: opacity 160ms ease, transform 160ms ease;
    }
    .send:hover:not(:disabled) { transform: scale(1.06); }
    .send:disabled { opacity: 0.35; cursor: default; }

    /* ---- restart, below the composer ----
       These used to sit inside .composer, to the right of the input, where they
       squeezed the writing area and read as send-adjacent actions. They are a
       separate offer ("run it again as..."), so they get their own row under the
       editor, with the server's heading directly above them. */
    .restart-head {
      max-width: 760px; margin: 14px auto 0; text-align: center;
      font-size: 11px; font-weight: 600; letter-spacing: 0.11em; text-transform: uppercase;
      color: var(--d-mute-2); font-family: var(--d-mono);
    }
    .restart-row {
      max-width: 760px; margin: 9px auto 0;
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    }
    .ghost {
      flex: 0 0 auto; height: 38px; padding: 0 18px; border-radius: 19px;
      background: var(--surface); border: none; color: var(--d-ink);
      box-shadow: var(--sh-raised-crisp);
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: box-shadow 200ms cubic-bezier(.2,.7,.2,1), transform 200ms cubic-bezier(.2,.7,.2,1);
    }
    .ghost:hover:not(:disabled) { transform: translateY(-1px); }
    .ghost:active:not(:disabled) { box-shadow: var(--sh-inset-crisp); transform: none; }
    .ghost:disabled { opacity: 0.4; cursor: default; }
    .foot {
      max-width: 760px; margin: 13px auto 0; text-align: center;
      font-size: 12px; color: var(--d-mute-2);
    }
    .foot a { color: var(--d-mute); text-decoration: underline; text-underline-offset: 2px; }
    .foot a:hover { color: var(--d-ink); }

    /* ---------------- recap panel ---------------- */
    .recap {
      flex: 0 0 360px; border-left: 1px solid var(--d-line);
      background: var(--glass-bg); overflow-y: auto; padding: 24px 24px 30px;
      -webkit-backdrop-filter: saturate(150%) blur(18px);
      backdrop-filter: saturate(150%) blur(18px);
      animation: slide 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes slide { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
    .recap h2 { font-family: var(--d-serif); font-size: 23px; font-weight: 400; margin-bottom: 4px; }
    .recap .sub { font-size: 12.5px; color: var(--d-mute); margin-bottom: 22px; }
    .recap h3 {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--d-mute-2); margin: 0 0 11px;
    }
    .recap-card {
      background: var(--paper); box-shadow: var(--sh-raised-crisp);
      border-radius: 12px; padding: 15px 16px; margin-bottom: 20px;
    }
    .recap-card p { font-size: 13.5px; line-height: 1.62; white-space: pre-wrap; }
    .brief-row {
      display: flex; justify-content: space-between; gap: 14px;
      padding: 9px 0; border-bottom: 1px solid var(--d-line);
    }
    .brief-row:last-child { border-bottom: none; }
    .brief-k { font-size: 12.5px; color: var(--d-mute); flex: 0 0 auto; }
    .brief-v { font-size: 13px; font-weight: 600; text-align: right; }
    .recap .note { font-size: 12px; color: var(--d-mute-2); line-height: 1.55; }

    .banner {
      max-width: 760px; margin: 0 auto 4px; padding: 11px 15px;
      background: var(--paper); box-shadow: var(--sh-raised-crisp);
      border-radius: 11px; font-size: 13px; color: var(--d-mute);
    }
    .center-msg {
      margin: auto; text-align: center; padding: 40px 24px; max-width: 420px;
    }
    .center-msg h1 { font-family: var(--d-serif); font-size: 30px; font-weight: 400; margin-bottom: 10px; }
    .center-msg p { color: var(--d-mute); font-size: 14px; }

    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    /* Booking celebration. Sits above everything and ignores pointer events, so
       it can never block the composer underneath it. */
    #confetti {
      position: fixed; inset: 0; pointer-events: none; z-index: 60;
      display: block;
    }

    @media (max-width: 900px) {
      .hdr { flex-wrap: wrap; gap: 10px 14px; padding: 11px 16px; }
      .hdr-logo img { height: 26px; }
      .track { order: 3; width: 100%; justify-content: space-between; }
      .track-line { width: auto; flex: 1 1 auto; margin: 0 7px; }
      .track-label { font-size: 9px; letter-spacing: 0.06em; }
      .pill { max-width: 55vw; }
      .wrap { flex-direction: column; }
      .recap { flex: 1 1 auto; border-left: none; border-top: 1px solid var(--d-line); }
      .stream { padding: 20px 16px 10px; }
      .composer-wrap { padding: 13px 16px 15px; }
      .restart-head { margin-top: 12px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
  (function () {
    "use strict";

    // ---- token ------------------------------------------------------------
    // The URL is /demo/<token>. Both Vercel and the Pi rewrite that to this
    // file with the path preserved, the same trick the landing page uses for
    // its /home variant, so the token is read from the path rather than a query
    // string. A query fallback exists only so the page can be opened directly
    // during development.
    var m = location.pathname.match(/\/demo\/([A-Za-z0-9]{4,64})/);
    var TOKEN = m ? m[1] : new URLSearchParams(location.search).get("token") || "";

    // Same-origin: Vercel rewrites /api/* to api.leadawaker.com, and the Pi
    // serves both. The page never needs to know which host it is on.
    var API = "/api/web-demo/" + encodeURIComponent(TOKEN);

    var STAGES = [
      { key: "new",       label: "New lead" },
      { key: "responded", label: "Responded" },
      { key: "qualified", label: "Qualified" },
      { key: "objective", label: "Objective reached" }
    ];

    var root = document.getElementById("root");
    var state = null;
    var recap = null;
    var pending = false;     // a visitor message is queued, awaiting a reply
    var busy = false;        // a fetch is in flight (send/restart)
    var pollTimer = null;
    var lastSig = "";
    var draft = "";
    var fatal = null;
    // Bumped by any action that replaces `state` outside of poll() itself
    // (send, restart). poll() captures this before it fetches and checks it
    // again when the response lands; a mismatch means a restart/send already
    // moved state on while this fetch was in flight, so the response is
    // discarded instead of clobbering fresher state.
    var epoch = 0;

    // ---- helpers ----------------------------------------------------------
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function clock(iso) {
      if (!iso) return "";
      var d = new Date(iso);
      if (isNaN(d)) return "";
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function initials(name) {
      var parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return "AI";
      return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
    }

    function signature(s) {
      // Cheap change detector so a poll that returns nothing new does not
      // re-render and blow away the caret position in the composer.
      if (!s) return "";
      return [s.stage, s.done, s.turnsUsed, s.messages.length,
              s.messages.length ? s.messages[s.messages.length - 1].text : ""].join("|");
    }

    function api(path, opts) {
      return fetch(API + (path || ""), opts).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (body) {
          if (!r.ok) {
            var e = new Error(body.message || "Request failed");
            e.code = body.code; e.status = r.status;
            throw e;
          }
          return body;
        });
      });
    }

    // ---- rendering --------------------------------------------------------
    function stageIndex(key) {
      for (var i = 0; i < STAGES.length; i++) if (STAGES[i].key === key) return i;
      return 0;
    }

    function trackerHtml(current) {
      var at = stageIndex(current);
      var out = [];
      for (var i = 0; i < STAGES.length; i++) {
        var cls = i < at ? "track-step done" : (i === at ? "track-step on" : "track-step");
        out.push('<div class="' + cls + '"><span class="track-dot"></span><span class="track-label">' + esc(STAGES[i].label) + "</span></div>");
        if (i < STAGES.length - 1) out.push('<div class="track-line"></div>');
      }
      return '<div class="track">' + out.join("") + "</div>";
    }

    function messagesHtml(s) {
      var out = [];
      for (var i = 0; i < s.messages.length; i++) {
        var msg = s.messages[i];
        var mine = msg.role === "visitor";
        var prev = s.messages[i - 1];
        var showAv = !mine && (!prev || prev.role !== "ai");
        out.push(
          '<div class="row ' + (mine ? "me" : "ai") + '">' +
            (mine ? "" : (showAv
              ? '<div class="av">' + esc(initials(s.agent)) + "</div>"
              : '<div class="av" style="visibility:hidden"></div>')) +
            '<div class="bub-wrap">' +
              '<div class="bub">' + esc(msg.text) + "</div>" +
              '<div class="ts">' + esc(clock(msg.at)) + "</div>" +
            "</div>" +
          "</div>"
        );
      }
      if (pending) {
        out.push(
          '<div class="row ai">' +
            '<div class="av">' + esc(initials(s.agent)) + "</div>" +
            '<div class="bub-wrap"><div class="bub typing"><i></i><i></i><i></i></div></div>' +
          "</div>"
        );
      }
      return out.join("");
    }

    function recapHtml() {
      if (!recap) {
        return '<aside class="recap"><h2>Wrapping up</h2><p class="sub">Reading back the conversation...</p></aside>';
      }
      var briefRows = "";
      if (recap.brief && recap.brief.length) {
        for (var i = 0; i < recap.brief.length; i++) {
          briefRows +=
            '<div class="brief-row"><span class="brief-k">' + esc(recap.brief[i].label) +
            '</span><span class="brief-v">' + esc(recap.brief[i].value) + "</span></div>";
        }
      }
      return (
        '<aside class="recap">' +
          "<h2>What just happened</h2>" +
          '<p class="sub">This is what lands in the CRM, automatically.</p>' +
          (recap.summary
            ? '<h3>Conversation</h3><div class="recap-card"><p>' + esc(recap.summary) + "</p></div>"
            : "") +
          (briefRows
            ? '<h3>The brief</h3><div class="recap-card">' + briefRows + "</div>" +
              '<p class="note">Every line came from the conversation. Nothing here was assumed.</p>'
            : '<p class="note">The conversation ended before a full brief was collected. Restart it and answer a few more questions to see the whole thing.</p>') +
        "</aside>"
      );
    }

    function render() {
      if (fatal) {
        root.innerHTML =
          '<div class="center-msg"><h1>' + esc(fatal.title) + "</h1><p>" + esc(fatal.body) + "</p></div>";
        return;
      }
      if (!state) {
        root.innerHTML = '<div class="center-msg"><p>Loading...</p></div>';
        return;
      }

      var s = state;
      // Server-provided: it carries the demo's real WhatsApp number, which only
      // the CRM knows. Absent it, the handoff line is hidden rather than
      // rendered as a wa.me link with no recipient.
      var waUrl = s.waLink || "";
      var restartsLeft = Math.max(0, (s.restartsMax || 0) - (s.restartsUsed || 0));
      // Only invited links (a prospect Gabriel sent this to) get to restart as
      // the OTHER scenario. Null on a public homepage session and on a link
      // that has spent its restarts; the server decides, not the page.
      var opts = restartsLeft > 0 && s.restartOptions && s.restartOptions.length
        ? s.restartOptions
        : null;

      root.innerHTML =
        '<header class="hdr">' +
          '<div class="hdr-logo"><img src="/premium/logo-v2.svg" alt="Lead Awaker" /></div>' +
          '<div class="hdr-spacer"></div>' +
          trackerHtml(s.stage) +
          '<div class="hdr-spacer"></div>' +
          (s.company ? '<div class="pill">' + esc(s.company) + "</div>" : "") +
        "</header>" +
        '<div class="wrap">' +
          '<div class="chat-col">' +
            '<div class="stream" id="stream">' +
              (s.done && s.cappedReason === "turns"
                ? '<div class="banner">This demo has reached its message limit. Restart it to run it again.</div>'
                : "") +
              messagesHtml(s) +
            "</div>" +
            '<div class="composer-wrap">' +
              '<div class="composer">' +
                '<div class="input-shell">' +
                  '<label class="sr" for="msg">Your reply</label>' +
                  '<textarea id="msg" rows="1" placeholder="' +
                    (s.done ? "This demo has finished" : "Reply as if you were the lead...") +
                    '"' + (s.done || busy ? " disabled" : "") + "></textarea>" +
                  '<button class="send" id="send" title="Send"' + (s.done || busy ? " disabled" : "") + ">" +
                    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>' +
                  "</button>" +
                "</div>" +
              "</div>" +
              // Restart lives BELOW the editor, not beside it: it is a separate
              // offer rather than a send-adjacent action, and inline it ate the
              // width of the writing area.
              //
              // Invited links get the two scenarios as buttons; a public
              // homepage session keeps the plain Restart it always had. Labels
              // and heading come from the server, already in the lead's
              // language (src/automations/demo_restart.py).
              (opts ? '<p class="restart-head">' + esc(opts[0].heading) + "</p>" : "") +
              '<div class="restart-row">' +
                (opts
                  ? opts.map(function (o) {
                      return '<button class="ghost restart-opt" data-scenario="' + esc(o.value) + '"' +
                        (busy || restartsLeft <= 0 ? " disabled" : "") + ">" + esc(o.label) + "</button>";
                    }).join("")
                  : '<button class="ghost" id="restart"' + (busy || restartsLeft <= 0 ? " disabled" : "") + ">Restart</button>") +
              "</div>" +
              '<p class="foot">' +
                (waUrl
                  ? 'On your phone? <a href="' + esc(waUrl) + '" target="_blank" rel="noopener">Run it in WhatsApp instead</a>.'
                  : "") +
                (restartsLeft > 0 ? " " + restartsLeft + " restart" + (restartsLeft === 1 ? "" : "s") + " left." : "") +
              "</p>" +
            "</div>" +
          "</div>" +
          (s.done ? recapHtml() : "") +
        "</div>";

      wire();
    }

    // ---- interaction ------------------------------------------------------
    function wire() {
      var ta = document.getElementById("msg");
      var send = document.getElementById("send");
      var restart = document.getElementById("restart");
      var stream = document.getElementById("stream");

      if (stream) stream.scrollTop = stream.scrollHeight;

      if (ta) {
        ta.value = draft;
        ta.style.height = "auto";
        ta.style.height = Math.min(120, ta.scrollHeight) + "px";
        if (!state.done && !busy) ta.focus();
        ta.addEventListener("input", function () {
          draft = ta.value;
          ta.style.height = "auto";
          ta.style.height = Math.min(120, ta.scrollHeight) + "px";
        });
        ta.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doSend(); }
        });
      }
      if (send) send.addEventListener("click", doSend);
      if (restart) restart.addEventListener("click", function () { doRestart(null); });
      Array.prototype.forEach.call(document.querySelectorAll(".restart-opt"), function (b) {
        b.addEventListener("click", function () { doRestart(b.getAttribute("data-scenario")); });
      });
    }

    function doSend() {
      if (busy || pending || !state || state.done) return;
      var text = draft.trim();
      if (!text) return;

      // Invalidate any poll fetch already in flight: without this, a response
      // that predates the send can land after the optimistic push below and
      // overwrite state.messages with server data that doesn't include it yet,
      // making the visitor's own message flicker or vanish.
      epoch++;

      // Optimistic: the visitor's own bubble appears instantly, then the typing
      // indicator. Waiting for the round trip to echo their own words back is
      // the single thing that makes a web chat feel broken.
      state.messages.push({ role: "visitor", text: text, at: new Date().toISOString() });
      draft = "";
      pending = true;
      busy = true;
      render();

      api("/message", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text: text })
      }).then(function () {
        busy = false;
        lastSig = "";      // force the next poll to re-render
        schedulePoll(1200);
      }).catch(function (err) {
        busy = false;
        pending = false;
        handleError(err);
      });
    }

    // `scenario` is null for the plain replay (public sessions) and one of the
    // server-supplied values for the two-option restart on an invited link.
    function doRestart(scenario) {
      if (busy || !state) return;
      busy = true;
      pending = false;
      var prevRecap = recap;   // snapshot so a failed restart can put the recap
                                // panel back to what it showed a moment ago,
                                // instead of leaving it stuck on the "wrapping
                                // up" placeholder until the next idle poll.
      recap = null;
      draft = "";
      // Invalidate any poll fetch already in flight: a routine poll started
      // before the restart can otherwise resolve AFTER it and silently revert
      // the UI to the old scenario's messages.
      epoch++;
      render();
      api("/restart", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(scenario ? { scenario: scenario } : {})
      }).then(function (next) {
        busy = false;
        state = next;
        lastSig = signature(next);
        render();
        // A restart is a fresh conversation, so it re-arms the celebration:
        // booking again in the new run should be celebrated again.
        celebrated = false;
        seenStage = next.stage || null;
        schedulePoll(4000);
      }).catch(function (err) {
        busy = false;
        recap = prevRecap;   // restore what was on screen before the optimistic clear
        handleError(err);
      });
    }

    function handleError(err) {
      if (err && err.status === 404) {
        fatal = { title: "This link is not valid", body: "It may have expired. Ask for a fresh one and it will work again." };
      } else if (err && err.code === "restart_limit") {
        // Not fatal: the conversation on screen is still readable. Render first
        // so the recap panel (restored by doRestart's catch) reflects the old
        // conversation again rather than staying on the placeholder, then patch
        // the foot text to explain why the restart didn't go through.
        render();
        var el = document.querySelector(".foot");
        if (el) el.textContent = "This link has been restarted the maximum number of times.";
        return;
      } else {
        fatal = { title: "Something went wrong", body: "Reload the page and it should pick up where it left off." };
      }
      render();
    }

    // ---- polling ----------------------------------------------------------
    // The engine debounces before it calls the model, so a reply can be several
    // seconds out. Polling keeps each request short and lets a multi-message
    // reply arrive balloon by balloon, the way it does on WhatsApp.
    function schedulePoll(delay) {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(poll, delay);
    }

    function poll() {
      if (busy) { schedulePoll(1500); return; }
      var pollEpoch = epoch;   // captured before the fetch fires
      api("").then(function (next) {
        if (pollEpoch !== epoch) {
          // A restart or send landed while this fetch was in flight and moved
          // state on already; applying this response now would clobber that
          // fresher state with stale data. The action that bumped the epoch
          // already scheduled its own follow-up poll, but reschedule anyway
          // (rather than trusting this response's own `done`/messages, which
          // may no longer be accurate) so the loop can't stall if that action
          // is still pending or failed outright.
          schedulePoll(pending ? 1600 : 6000);
          return;
        }
        var sig = signature(next);
        var grew = state && next.messages.length > state.messages.length;
        state = next;
        if (grew) pending = false;
        if (sig !== lastSig) { lastSig = sig; render(); }
        maybeCelebrate(next);

        if (next.done) {
          if (!recap) loadRecap();
          schedulePoll(15000);       // idle: keep the session warm, nothing more
        } else {
          schedulePoll(pending ? 1600 : 6000);
        }
      }).catch(function (err) {
        if (pollEpoch !== epoch) { schedulePoll(pending ? 1600 : 6000); return; }
        if (err && err.status === 404) return handleError(err);
        schedulePoll(6000);          // transient: keep trying quietly
      });
    }

    function loadRecap() {
      if (recap) return;
      api("/recap").then(function (data) {
        recap = data || { summary: "", brief: [] };
        render();
      }).catch(function () {
        recap = { summary: "", brief: [] };
        render();
      });
    }

    // ---- booking celebration ----------------------------------------------
    // Fires once, on the transition INTO the booked stage ("objective"), which
    // is the moment the demo pays off. Deliberately not on first paint: someone
    // reopening a demo they booked yesterday should not be thrown a party for
    // it, so the first state we see only records the stage.
    var seenStage = null;
    var celebrated = false;

    function maybeCelebrate(next) {
      var stage = next && next.stage;
      if (seenStage && seenStage !== "objective" && stage === "objective" && !celebrated) {
        celebrated = true;
        confetti();
      }
      if (stage) seenStage = stage;
    }

    function confetti() {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      var cv = document.createElement("canvas");
      cv.id = "confetti";
      cv.setAttribute("aria-hidden", "true");
      document.body.appendChild(cv);
      var ctx = cv.getContext("2d");
      if (!ctx) { cv.parentNode.removeChild(cv); return; }

      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W = 0, H = 0;
      function size() {
        W = window.innerWidth; H = window.innerHeight;
        cv.width = W * dpr; cv.height = H * dpr;
        cv.style.width = W + "px"; cv.style.height = H + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      size();
      window.addEventListener("resize", size);

      // The site's own palette, not party colours: wine, its soft tint, a warm
      // gold picked from the directional light, and paper.
      var COLORS = ["#5E2230", "#7A2E3E", "#C9A227", "#F4EFE3", "#D8C9A3"];
      var bits = [];
      for (var i = 0; i < 110; i++) {
        bits.push({
          x: W * (0.15 + Math.random() * 0.7),
          y: H + 20 + Math.random() * 40,
          vx: (Math.random() - 0.5) * 5.2,
          vy: -(11 + Math.random() * 9),      // launched upward, then gravity takes it
          w: 5 + Math.random() * 6,
          h: 8 + Math.random() * 8,
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 0.32,
          c: COLORS[(Math.random() * COLORS.length) | 0]
        });
      }

      var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
      var LIFE = 2900;
      var FADE = 700;

      function frame(now) {
        var age = now - t0;
        if (age >= LIFE) {
          window.removeEventListener("resize", size);
          if (cv.parentNode) cv.parentNode.removeChild(cv);
          return;
        }
        ctx.clearRect(0, 0, W, H);
        var fade = age > LIFE - FADE ? (LIFE - age) / FADE : 1;
        for (var j = 0; j < bits.length; j++) {
          var b = bits[j];
          b.vy += 0.34;          // gravity
          b.vx *= 0.995;         // air drag
          b.x += b.vx; b.y += b.vy; b.rot += b.vr;
          if (b.y > H + 60) continue;
          ctx.save();
          ctx.globalAlpha = fade;
          ctx.translate(b.x, b.y);
          ctx.rotate(b.rot);
          ctx.fillStyle = b.c;
          ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
          ctx.restore();
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    // ---- boot -------------------------------------------------------------
    if (!TOKEN) {
      fatal = { title: "No demo link", body: "This page needs a demo link. Ask for one and open it directly." };
      render();
    } else {
      render();
      api("").then(function (s) {
        state = s;
        lastSig = signature(s);
        render();
        maybeCelebrate(s);        // records the opening stage; cannot fire yet
        if (s.done) loadRecap();
        schedulePoll(s.done ? 15000 : 6000);
      }).catch(handleError);
    }
  })();
  </script>
</body>
</html>
