<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Apply the saved theme before first paint so the .dark class exists when
         React mounts. Prevents a light-mode flash and stops components that
         memoize theme-derived values (e.g. avatar colors) from caching the
         wrong palette on first render. Mirrors useTheme's initializer. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/premium/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#5E2230" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Lead Awaker</title>
    <!-- This shell is the CRM, and vercel.json's catch-all also serves it (with a
         200) for every URL that matches nothing else. noindex keeps those
         mistyped and retired URLs, and the app itself, out of search results.
         The public pages are static files under client/public/. -->
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="Lead Awaker: the AI receptionist that picks up when you can't" />
    <meta property="og:description" content="Sara answers your phone, website chat and WhatsApp day and night, and books customers straight into your calendar." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.leadawaker.com/site/img/og-en.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lead Awaker: the AI receptionist that picks up when you can't" />
    <meta name="twitter:description" content="Sara answers your phone, website chat and WhatsApp day and night, and books customers straight into your calendar." />
    <meta name="twitter:image" content="https://www.leadawaker.com/site/img/og-en.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Geist+Mono:wght@400;500;600&family=Yeseva+One&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
